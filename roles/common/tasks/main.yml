---
- name: Install common hardening packages
  tags: [common]
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - unattended-upgrades
      - apt-transport-https
      - git
      - git-crypt
      - net-tools
    state: present
    update_cache: true

# become_user below is secrets.admin_username, the OS account these two tasks must run as — an accepted, undefended
# exception (scripts/check_secret_suppression.py's ACCEPTED_BECOME_USER_EXCEPTIONS): unlike a token, an account name
# has no file-reference alternative (sudo/su need it as a literal argument), so Ansible's own connection-plugin
# trace will print it at high verbosity regardless of no_log — found via epic 22 #05's independent review, which
# also confirmed a username is not a credential in the traditional sense (knowing it grants no capability by
# itself). `value:` (the actual git identity) IS protected by no_log, which is what it's there for.
- name: Configure global git user.name for admin user
  tags: [common]
  community.general.git_config:
    name: user.name
    scope: global
    value: "{{ secrets.git_username | default('') }}"
    state: present
  become: true
  become_user: "{{ secrets.admin_username }}"
  when: secrets.git_username | default('') | length > 0
  no_log: true   # value: is a module argument sourced from the secrets dict

- name: Configure global git user.email for admin user
  tags: [common]
  community.general.git_config:
    name: user.email
    scope: global
    value: "{{ secrets.git_email | default('') }}"
    state: present
  become: true
  become_user: "{{ secrets.admin_username }}"
  when: secrets.git_email | default('') | length > 0
  no_log: true   # value: is a module argument sourced from the secrets dict

- name: Configure unattended-upgrades
  tags: [common]
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Mount /run/shm with noexec,nosuid
  tags: [common]
  ansible.posix.mount:
    path: /run/shm
    src: tmpfs
    fstype: tmpfs
    opts: defaults,noexec,nosuid
    state: mounted
    boot: true
# UFW (host firewall) is now owned by the tailscale role (epic 07 #01), which sets the
# default-deny policy, the 22/80/443 allow rules, and the Tailscale interface allow.
