---
- name: Create SilverBullet deployment directory
  tags: [silverbullet]
  ansible.builtin.file:
    path: "{{ silverbullet_compose_dir }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0775'

- name: Start consolidated docker compose
  tags: [silverbullet]
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}"
    project_name: "{{ docker_project_name }}"
    services:
      - caddy
      - authelia
      - silverbullet
    state: present
    pull: missing
  ignore_errors: "{{ ansible_check_mode }}"