---
- name: Create SilverBullet deployment directory
  tags: [silverbullet]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ silverbullet_compose_dir }}"
    wiki_volume_directory_mode: '0775'

- name: Start consolidated docker compose
  tags: [silverbullet]
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}"
    project_name: "{{ docker_project_name }}"
    services:
      - caddy
      - authelia
      - silverbullet
    state: present
    pull: missing
  ignore_errors: "{{ ansible_check_mode }}"
