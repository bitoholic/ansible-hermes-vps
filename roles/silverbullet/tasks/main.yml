---
- name: Create SilverBullet deployment directory
  tags: [silverbullet]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ silverbullet_compose_dir }}"
    wiki_volume_directory_mode: '0775'

# The redundant second "docker compose up" call (scoped to caddy/authelia/
# silverbullet) that used to live here is deleted (epic 16, #01) — it was an
# incomplete workaround for the same config-timing bug epic 16 fixes properly by
# relocating docker's single compose-stack start to the end of the play, after every
# config-deploying role (including this one) has run. That single, correctly-
# positioned start now covers these three services too.
