---
docker_compose_dir: /opt/hermes-vps
docker_project_name: hermes-vps

# IP_ADDRESS is used in service templates for host port bindings and container
# command arguments. Defaults to 0.0.0.0 (bind all interfaces) but can be
# overridden in group_vars or the environment.
IP_ADDRESS: 0.0.0.0

# UID/GID for services that run as the llm_wiki user (authelia, silverbullet, signal-cli).
# These are normally set by the wiki_volume role, but defaults are provided to allow the
# docker role to render templates standalone (e.g., in CI without the wiki_volume role).
wiki_volume_uid: 1000
wiki_volume_gid: 1000

# Standard networks
docker_networks:
  - name: gateway
    driver: bridge
  - name: internal
    driver: bridge

# Named volumes declared at the top level of the consolidated compose file.
# Services reference these by short name in their fragment's `volumes:` block.
docker_volumes:
  - caddy_data
  - caddy_config

# Services to enable. Each service must have a corresponding fragment in
# roles/docker/templates/services/<name>.yml.j2
docker_enabled_services:
  - caddy
  - authelia
  - silverbullet
  - conduit
  - signal-cli
  - hermes-agent
