---
- name: Validate Docker role prerequisites
  tags: [docker]
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.admin_username is defined
      - secrets.admin_username | string | length > 0
    fail_msg: "Docker role requires a Debian/Ubuntu target and admin_username defined."

# The container UID/GID (wiki_volume_uid/gid) is resolved by the wiki_volume role
# (meta dependency) and consumed by the service fragments below so containers can
# read/write bind-mounted volumes owned by llm_wiki on the host. CI render tests
# stub those vars directly.
- name: Install Docker prerequisites
  tags: [docker]
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Create Docker apt keyring directory
  tags: [docker]
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker apt signing key
  tags: [docker]
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker apt repository
  tags: [docker]
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  tags: [docker]
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure admin user is in the docker group
  tags: [docker]
  ansible.builtin.user:
    name: "{{ secrets.admin_username }}"
    groups: docker
    append: true
    state: present

- name: Ensure Docker service is enabled and running
  tags: [docker]
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Ensure shared Docker proxy network exists
  tags: [docker]
  community.docker.docker_network:
    name: proxy_net
    state: present
    driver: bridge

- name: Ensure shared Docker hermes internal network exists
  tags: [docker]
  community.docker.docker_network:
    name: hermes_net
    state: present
    driver: bridge

- name: Create Docker Compose project directory
  tags: [docker]
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}"
    state: directory
    mode: '0755'

- name: Ensure Docker gateway network exists
  tags: [docker]
  community.docker.docker_network:
    name: gateway
    state: present
    driver: bridge

- name: Ensure Docker internal network exists
  tags: [docker]
  community.docker.docker_network:
    name: internal
    state: present
    driver: bridge

- name: Render consolidated docker-compose.yml
  tags: [docker]
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/docker-compose.yml"
    mode: '0644'

- name: Validate consolidated docker-compose.yml syntax
  tags: [docker]
  ansible.builtin.command:
    cmd: "docker compose -f {{ docker_compose_dir }}/docker-compose.yml config"
  changed_when: false
  register: docker_compose_config
  ignore_errors: "{{ ansible_check_mode }}"

- name: Fail if docker compose config validation fails
  tags: [docker]
  ansible.builtin.fail:
    msg: "Consolidated docker-compose.yml failed validation: {{ docker_compose_config.stderr }}"
  when: docker_compose_config is failed

# Epic 18, #05: pull every enabled service's image now, while the host's own DNS
# resolution is still fully intact — AdGuard's own DNS handover
# (roles/adguard/tasks/free_host_dns_port.yml) runs immediately before the stack
# actually starts (tasks/start.yml) and deliberately disables systemd-resolved's
# stub listener to free port 53 for AdGuard, breaking host DNS for a brief
# window. By the time that handover runs, "docker compose up" must not need ANY
# network access — found via code review: a fresh VPS bootstrap needs to pull
# every image in one "up" invocation, and if that invocation needs DNS while
# host DNS is down, the ENTIRE stack-start fails (aborting the whole play right
# there, since tasks/start.yml only ignores errors in --check mode). Pull-only:
# never touches running containers or bind-mounted config files, so it's safe
# to run this early — unlike the actual "up" (start.yml), which epic 16 already
# established must NOT run this early (containers would start before their
# bind-mounted config files exist). Services with `build:` instead of `image:`
# (hermes-agent) need --ignore-buildable: caught in review, verified against
# docker/compose#8805/#10134 and this host's own `docker compose pull --help` —
# without the flag, `docker compose pull` does NOT skip build-only services
# automatically as an earlier version of this comment assumed; it tries to pull
# one anyway and fails non-zero, which would abort this task (and therefore the
# whole play, outside --check mode) on every single run, unconditionally.
- name: Pre-pull all enabled service images before host DNS is ever touched
  tags: [docker]
  ansible.builtin.command:
    cmd: "docker compose -f {{ docker_compose_dir }}/docker-compose.yml pull --ignore-buildable"
  changed_when: true
  ignore_errors: "{{ ansible_check_mode }}"

# Epic 14, #02: docker keeps its own call site (needs these directories before its
# own compose-stack build/start), duplicated with the hermes role's — that role-
# ordering constraint is epic 15's to resolve, not this ticket's. What changes here
# is that both roles now call the same shared implementation instead of each
# hand-writing its own file task.
- name: Ensure Hermes home directory exists for image build context
  tags: [docker]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ hermes_home }}"
    wiki_volume_directory_mode: '0700'
    wiki_volume_directory_recurse: true

- name: Ensure Hermes Signal data directory exists
  tags: [docker]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ hermes_home }}/signal-data"
    wiki_volume_directory_mode: '0775'

- name: Ensure Hermes profile directories exist
  tags: [docker]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ hermes_home }}/profiles/{{ item.name }}"
    wiki_volume_directory_mode: '0700'
  loop: "{{ hermes_profiles }}"
  when: item.target_dir is not defined

- name: Copy Hermes Dockerfile to hermes home
  tags: [docker]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/hermes/files/Dockerfile"
    dest: "{{ hermes_home }}/Dockerfile"
    owner: "{{ secrets.admin_username }}"
    group: llm_wiki
    mode: '0640'

# Epic 19, #01: Caddy's own build context, mirroring the Hermes pattern above
# — a dedicated directory (not docker_compose_dir itself) so the build
# context doesn't accidentally pull in the whole compose-dir tree.
- name: Ensure Caddy build context directory exists
  tags: [docker]
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/caddy"
    state: directory
    mode: '0755'

- name: Copy Caddy Dockerfile to build context
  tags: [docker]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/gateway/files/Dockerfile"
    dest: "{{ docker_compose_dir }}/caddy/Dockerfile"
    owner: "{{ secrets.admin_username }}"
    group: llm_wiki
    mode: '0640'

# "Start consolidated docker compose stack" moved to tasks/start.yml (epic 16, #01) —
# no longer runs automatically as part of this role's default sequence. It's invoked
# explicitly at the end of site.yml's play, after every role that deploys a
# bind-mounted config file (conduit, hermes, authelia, gateway) has done so. See
# tasks/start.yml for why.
