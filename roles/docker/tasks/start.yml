---
# Epic 16, #01: the actual "docker compose up" step, extracted out of this role's
# default task sequence. docker's own position in site.yml runs too early for this —
# it starts every enabled service, including conduit/authelia/hermes-agent, before
# the conduit/hermes/authelia roles (listed after docker) ever render the host-side
# config files those containers bind-mount. On a fresh bootstrap this can start a
# container before the file it depends on exists (the same bug class already fixed
# twice for other services in this repo: OwnTracks storage permissions, a stale
# Caddyfile directory).
#
# Invoked from site.yml's end-of-play tasks via import_role/tasks_from — NOT a bare
# include_tasks — so this role's own meta/main.yml dependencies still fire for it,
# the same way they do for any other role invocation.

# build: always (epic 19, #01, caught in review): the default `policy` only
# builds a service's image if none exists yet under that project/service name
# — a Dockerfile edit on a host that already has a built image from a prior
# run would silently keep running the STALE binary, with nothing here
# surfacing that. This now matters for two build-based services (hermes-agent,
# and Caddy as of this ticket) instead of one, and Caddy is the stack's single
# TLS-termination point, so a silently-stale rebuild here is a materially
# bigger risk than it was for hermes-agent alone. `always` is Docker's own
# layer-cache-backed rebuild — cheap (a no-op re-verify) when the Dockerfile
# hasn't actually changed, so this doesn't meaningfully slow down the common
# case of a redeploy where nothing built changed.
# Epic 23 #03: no `services:` filter — omitting it (module default: null) starts every service
# actually present in the rendered docker-compose.yml, the same as a plain `docker compose up -d`
# with no service arguments. Previously restricted to docker_enabled_services, which was already
# redundant (the file only ever contained exactly those services) and would have silently excluded
# any service a list-driven fragment renders (epic 23's exit-node pairs — one fragment renders
# several services whose names aren't in that single-service-per-entry list at all). This is the
# generic fix the spec asks for: the start step addresses the *rendered* service set, whatever
# produced it, with no bookkeeping list to keep in sync.
- name: Start consolidated docker compose stack
  tags: [docker]
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}"
    project_name: "{{ docker_project_name }}"
    files:
      - docker-compose.yml
    state: present
    pull: missing
    build: always
  ignore_errors: "{{ ansible_check_mode }}"
