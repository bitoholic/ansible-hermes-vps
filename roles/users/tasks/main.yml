---
- name: Assert admin username is provided
  tags: [users]
  ansible.builtin.assert:
    that:
      - secrets.admin_username is defined
      - secrets.admin_username | string | length > 0
    fail_msg: "admin_username must be defined before creating host users."

- name: Create llm_wiki system group
  tags: [users]
  ansible.builtin.group:
    name: llm_wiki
    state: present
    system: true

- name: Create llm_wiki system user
  tags: [users]
  ansible.builtin.user:
    name: llm_wiki
    group: llm_wiki
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Add admin user to llm_wiki group
  tags: [users]
  ansible.builtin.user:
    name: "{{ secrets.admin_username }}"
    groups: llm_wiki
    append: true
    state: present
