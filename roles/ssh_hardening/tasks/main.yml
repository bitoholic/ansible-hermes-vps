---
- name: Assert admin SSH hardening variables are present
  tags: [ssh_hardening]
  ansible.builtin.assert:
    that:
      - secrets.admin_username is defined
      - secrets.admin_username | string | length > 0
      - secrets.admin_ssh_public_key is defined
      - secrets.admin_ssh_public_key | string | length > 0
    fail_msg: "admin_username and admin_ssh_public_key must be set before running ssh_hardening."

- name: Ensure openssh client is installed for local SSH authentication testing
  tags: [ssh_hardening]
  ansible.builtin.apt:
    name: openssh-client
    state: present
    update_cache: false
  when: ansible_os_family == 'Debian'


- name: Ensure SSH config include directory exists
  tags: [ssh_hardening]
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy hardened SSH daemon configuration
  tags: [ssh_hardening]
  ansible.builtin.template:
    src: 99-hardened.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardened.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart ssh

- name: Validate SSH daemon configuration syntax
  tags: [ssh_hardening]
  ansible.builtin.command:
    cmd: sshd -t -f /etc/ssh/sshd_config
  register: ssh_hardening_sshd_syntax_check
  changed_when: false
  failed_when: ssh_hardening_sshd_syntax_check.rc != 0
