---
# Epic 22 #05: no_log because the task's OWN result (every loop iteration's "before"/"after" fact value) is the
# whole accumulated secrets dict at high verbosity — this is defense in depth, not a contract change: the fact
# itself is unaffected and every other task in this file (and every consumer of `secrets`) reads it exactly as
# before.
- name: Resolve secrets from the manifest into a single secrets dict  # noqa: var-naming[no-role-prefix]
  tags: [secrets]
  no_log: true
  ansible.builtin.set_fact:
    secrets: >-
      {{ secrets | default({})
         | combine(
             ( {'profiles': {item.value.profile: {_leaf: resolved_value}}}
               if item.value.profile is defined
               else {item.key: resolved_value} ),
             recursive=true) }}
  loop: "{{ secrets_manifest | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    env_value: "{{ lookup('ansible.builtin.env', item.value.env) | default('') }}"
    resolved_value: "{{ env_value if env_value | length > 0 else (item.value.default | default('', true)) }}"
    _leaf: >-
      {{ item.key if not (item.value.profile is defined and item.key.startswith(item.value.profile ~ '_'))
         else item.key[(item.value.profile | length + 1):] }}

- name: Collect missing required secrets (including per-profile)  # noqa: var-naming[no-role-prefix]
  tags: [secrets]
  ansible.builtin.set_fact:
    secrets_missing: >-
      {{ (secrets_missing | default([]))
         + ( [ (item.value.profile ~ '.' ~ _leaf) if item.value.profile is defined else item.key ]
              if (item.value.required | default(false) and resolved_value | length == 0) else [] ) }}
  loop: "{{ secrets_manifest | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    env_value: "{{ lookup('ansible.builtin.env', item.value.env) | default('') }}"
    resolved_value: "{{ env_value if env_value | length > 0 else (item.value.default | default('', true)) }}"
    _leaf: >-
      {{ item.key if not (item.value.profile is defined and item.key.startswith(item.value.profile ~ '_'))
         else item.key[(item.value.profile | length + 1):] }}

- name: Summarize resolved secrets (preflight)
  tags: [secrets]
  no_log: true   # only ever prints counts and missing NAMES, never a value — no_log anyway, for one uniform rule
  ansible.builtin.debug:
    msg: >-
      Resolved {{ secrets | length }} top-level secret(s) and
      {{ secrets.profiles | default({}) | length }} profile(s).
      Missing required: {{ secrets_missing | default([]) }}

# secrets_enforce_required defaults to true (the spec's fail-fast contract) but is
# disabled in the local dry-run test playbook, which sets vars directly rather than via env.
- name: Fail fast on missing required secrets
  tags: [secrets]
  ansible.builtin.assert:
    that:
      - secrets_missing | default([]) | length == 0
    fail_msg: >-
      Missing required secrets (set the corresponding environment variables):
      {{ secrets_missing | default([]) | join(', ') }}
  when: secrets_enforce_required | default(true) | bool
