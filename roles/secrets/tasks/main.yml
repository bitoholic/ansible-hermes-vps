---
- name: Resolve secrets from the manifest into a single secrets dict  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    secrets: >-
      {{ secrets | default({}) | combine({item.key: resolved_value}) }}
  loop: "{{ secrets_manifest | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    env_value: "{{ lookup('ansible.builtin.env', item.value.env) | default('') }}"
    resolved_value: "{{ env_value if env_value | length > 0 else (item.value.default | default('', true)) }}"

- name: Collect missing required secrets
  ansible.builtin.set_fact:
    secrets_missing: "{{ required_keys | intersect(empty_keys) }}"
  vars:
    required_keys: >-
      {{ secrets_manifest | dict2items
         | selectattr('value.required', 'defined')
         | selectattr('value.required')
         | map(attribute='key') | list }}
    empty_keys: >-
      {{ secrets | dict2items
         | selectattr('value', 'eq', '')
         | map(attribute='key') | list }}

- name: Summarize resolved secrets (preflight)
  ansible.builtin.debug:
    msg: >-
      Resolved {{ secrets | length }} secret(s). Missing required: {{ secrets_missing | default([]) }}

# secrets_enforce_required defaults to true (the spec's fail-fast contract) but is
# disabled in the local dry-run test playbook, which sets vars directly rather than via env.
- name: Fail fast on missing required secrets
  ansible.builtin.assert:
    that:
      - secrets_missing | default([]) | length == 0
    fail_msg: >-
      Missing required secrets (set the corresponding environment variables):
      {{ secrets_missing | default([]) | join(', ') }}
  when: secrets_enforce_required | default(true) | bool
