---
- name: Validate Tailscale role prerequisites
  tags: [tailscale]
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.tailscale_authkey is defined
      - secrets.tailscale_authkey | string | length > 0
    fail_msg: >-
      Tailscale role requires a Debian/Ubuntu host and secrets.tailscale_authkey
      (set TAILSCALE_AUTHKEY).

# --- Tailscale daemon (VPN overlay) -------------------------------------------
- name: Install ufw (host firewall package)
  tags: [tailscale]
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Check whether Tailscale is already installed
  tags: [tailscale]
  ansible.builtin.command:
    cmd: which tailscale
  register: tailscale_present
  changed_when: false
  failed_when: false

- name: Download the official Tailscale install script
  tags: [tailscale]
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: '0755'
  when: tailscale_present.rc != 0

- name: Install Tailscale
  tags: [tailscale]
  ansible.builtin.command:
    cmd: /tmp/tailscale-install.sh
  when: tailscale_present.rc != 0
  changed_when: true

- name: Ensure tailscaled service is enabled and running
  tags: [tailscale]
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true
  when: tailscale_present.rc == 0 and not ansible_check_mode
  ignore_errors: "{{ ansible_check_mode }}"

- name: Probe Tailscale backend state
  tags: [tailscale]
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

# Idempotent: only bring the node up if it is not already in the Running state.
# The host-DNS preference (epic 21 #04) is restated EXPLICITLY in both switch states. Enabling ownership sets
# the node to --accept-dns=false, a non-default preference; `tailscale up` refuses to change settings without
# restating every non-default flag. Restating it only while the switch is on would let a later re-login FAIL
# after the switch is turned back off (the preference would still be false), so both values are written.
- name: Bring up Tailscale (login via auth key)
  tags: [tailscale]
  ansible.builtin.command:
    cmd: >-
      tailscale up --authkey={{ secrets.tailscale_authkey }} --hostname={{ inventory_hostname }}
      --accept-dns={{ 'false' if (host_dns_resolver_owner_enabled | default(false) | bool) else 'true' }}
  when: >-
    tailscale_status is not defined or
    tailscale_status.rc != 0 or
    ((tailscale_status.stdout | string | length > 0) and
     ((tailscale_status.stdout | from_json).BackendState | default('') != 'Running'))
  changed_when: true

# The VPS's own tailnet address(es) (epic 20): needed by the caddy-relay compose
# fragment to know which interface to bind, so tailnet-facing traffic can reach it
# without going through Caddy's own (public-IP-only, post epic 20) port-publish.
# Queried via `tailscale ip`, not Ansible's generic interface-fact-gathering
# (`ansible_tailscale0`) — this is the same official, stable interface epic 18's
# own README instructions already point operators at, and doesn't depend on how
# reliably Ansible's `setup` module parses a WireGuard-style /32 point-to-point
# interface. Must run after "Bring up Tailscale" above: the tailscale0 interface
# (and therefore any address on it) doesn't exist before that task has run.
- name: Query this host's own Tailscale IPv4 address
  tags: [tailscale]
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_ip_v4_result
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Query this host's own Tailscale IPv6 address
  tags: [tailscale]
  ansible.builtin.command:
    cmd: tailscale ip -6
  register: tailscale_ip_v6_result
  changed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

# Empty-string fallback (not a hard failure) under --check on a host where
# "Bring up Tailscale" above was itself skipped (command/shell tasks don't
# support check mode) — a --check preview should still render the rest of the
# play, not crash on an address that genuinely can't be known yet.
- name: Set facts for this host's own Tailscale addresses
  tags: [tailscale]
  ansible.builtin.set_fact:
    tailscale_ip_v4: "{{ tailscale_ip_v4_result.stdout | default('') | trim }}"
    tailscale_ip_v6: "{{ tailscale_ip_v6_result.stdout | default('') | trim }}"

# --- Host firewall (single owner of the perimeter) ----------------------------
# Default-deny inbound; allow the SSH fallback (key-only via ssh_hardening), the
# Caddy/MFA ingress (80/443), and the Tailscale VPN interface. The Tailscale subnet
# constant is also consumed by the gateway Caddy MFA bypass (epic 07 #02).
- name: Allow the Tailscale VPN interface
  tags: [tailscale]
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ tailscale_interface }}"
    comment: "Tailscale private access"

# 8443, not 8448 (epic 19, #02): matrix + owntracks recorder moved here so
# their DNS records can be Cloudflare-proxied (Cloudflare's proxy allowlist
# includes 8443, not 8448) — see roles/conduit/defaults/main.yml's own comment
# for the full rationale.
- name: Rate-limit SSH, HTTP, HTTPS, and OwnTracks/Matrix HTTPS
  tags: [tailscale]
  community.general.ufw:
    rule: limit
    port: "{{ item }}"
    proto: tcp
    comment: "{{ 'Limit SSH attempts' if item == common_ssh_port else 'Rate-limit web traffic' }}"
  loop:
    - "{{ common_ssh_port }}"
    - 80
    - 443
    - 8443

# Cleanup for the 8448 -> 8443 move (epic 19, #02, discovered on the first real
# deploy of this migration): this repo's UFW rate-limit rules are ensured
# PRESENT by the loop above, not declaratively rebuilt from a single source of
# truth the way the DOCKER-USER chain is (that chain is atomically replaced from the rendered rules
# on every run; plain `ufw` rules aren't, since many unrelated rules
# from other tasks/roles share the same firewall — a full flush-and-rebuild of
# every UFW rule isn't this fix's scope). Without this, a host that was ever
# deployed before this ticket keeps an orphaned rate-limit rule for a port
# nothing publishes anymore. `delete: true` is idempotent — a no-op on any
# host that never had 8448 (a fresh deploy) or has already been cleaned up.
- name: Remove the stale 8448 rate-limit rule (superseded by 8443)
  tags: [tailscale]
  community.general.ufw:
    rule: limit
    port: 8448
    proto: tcp
    delete: true

# --- Syncplay IP allowlist (epic 12, #06) --------------------------------------
# IP-restricted public access: each allowed IP gets allow + rate-limit in one
# rule (ufw limit = allow with a 6-connections/30s flood guard); every other
# source falls through to the default-deny incoming policy below. Deliberately
# NO catch-all `limit 8999` rule: ufw limit *allows* traffic (rate-limited),
# so it would open the port to the whole internet and defeat the allowlist.
- name: Allow and rate-limit Syncplay from allowed IPs
  tags: [tailscale]
  community.general.ufw:
    rule: limit
    from: "{{ item }}"
    port: 8999
    proto: tcp
    comment: "Syncplay friend access"
  loop: "{{ syncplay_allowed_ips | default([]) }}"

- name: Set UFW default incoming policy (default-deny)
  tags: [tailscale]
  community.general.ufw:
    direction: incoming
    policy: "{{ common_ufw_default_incoming_policy | lower }}"  # noqa: args[module]

- name: Set UFW default outgoing policy
  tags: [tailscale]
  community.general.ufw:
    direction: outgoing
    policy: "{{ common_ufw_default_outgoing_policy | lower }}"  # noqa: args[module]

# --- Docker published ports (epic 12, #08; boot-persistent and atomic since epic 21, #02) -------
# Docker-published ports bypass UFW entirely: DNAT happens in nat PREROUTING and Docker's own
# FORWARD rules ACCEPT the traffic before UFW's INPUT is ever consulted. The supported
# enforcement point is the DOCKER-USER chain (processed before Docker's rules). This role is the
# single firewall owner, so it owns that chain too.
#
# One source, one rendering: the port classes (group_vars/all/main.yml) are rendered ONCE per IP
# family into restore-format files, and ONE loader (hermes-docker-user-rules) puts them in the
# kernel — both this deploy and the boot firewall unit call it, so the two can never disagree.
# The load is atomic (iptables-restore --noflush replaces only the declared DOCKER-USER chain in
# one transaction; Docker's chains, UFW and sshd are never touched), which removes the window the
# old flush-then-append sequence opened on every deploy. Port classes: public (80/443/8443),
# Tailscale-only TCP, Tailscale-only UDP (adguard-dns 53), and syncplay 8999 (syncplay_allowed_ips).
# NOTE: 1:1 host:container mappings only — post-DNAT dport == original dport.
#
# Why a boot unit at all: kernel rules are lost at reboot and Docker recreates the chain empty, so
# the old "restored by playbook run" model left every restricted port unenforced until an operator
# noticed (found live: chain empty ~23 h after boot). The epic 21 spike showed Docker preserves a
# pre-populated chain across daemon start and restart, hence Before=docker.service closes the window.
- name: Ensure the DOCKER-USER firewall directory exists
  tags: [tailscale]
  ansible.builtin.file:
    path: "{{ tailscale_docker_user_firewall_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Render the DOCKER-USER rules for each IP family
  tags: [tailscale]
  ansible.builtin.template:
    src: "docker-user.rules.{{ item }}.j2"
    dest: "{{ tailscale_docker_user_firewall_dir }}/docker-user.{{ item }}.rules"
    owner: root
    group: root
    mode: '0640'
    # A file that does not parse is never installed: were it left on disk, a later boot could load a broken
    # ruleset (or, with the fail-closed coupling still off, leave Docker up with an empty chain).
    validate: "{{ 'ip6tables-restore' if item == 'v6' else 'iptables-restore' }} --noflush --test %s"
  loop:
    - v4
    - v6

- name: Install the shared DOCKER-USER loader
  tags: [tailscale]
  ansible.builtin.copy:
    src: hermes-docker-user-rules
    dest: "{{ tailscale_docker_user_firewall_loader }}"
    owner: root
    group: root
    mode: '0755'

- name: Install the boot firewall unit
  tags: [tailscale]
  ansible.builtin.template:
    src: hermes-docker-user-firewall.service.j2
    dest: /etc/systemd/system/hermes-docker-user-firewall.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for the Hermes firewall units

# Boot ordering (epic 21 #04): Docker after the Tailscale daemon — ordering only, never a dependency, so
# a Tailscale outage can't keep Docker from starting. Installed unconditionally (it cannot stop anything).
- name: Ensure the docker.service drop-in directory exists
  tags: [tailscale]
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Order Docker after the Tailscale daemon (ordering only)
  tags: [tailscale]
  ansible.builtin.template:
    src: docker-after-tailscaled.conf.j2
    dest: /etc/systemd/system/docker.service.d/20-hermes-after-tailscaled.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for the Hermes firewall units

# Staged rollout (epic 21 spec): the fail-closed coupling — docker.service Requires= the boot
# unit — ships DISABLED. An untested fail-closed unit shipped by a routine deploy could take the
# stack down; the attended reboot drill (ticket #06) enables it after the unit has been observed
# working. Disabling it later removes the drop-in again, so the variable is the single switch.
- name: Install the fail-closed coupling drop-in (only when tailscale_docker_user_firewall_fail_closed is true)
  tags: [tailscale]
  ansible.builtin.template:
    src: docker-fail-closed.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-hermes-firewall-fail-closed.conf
    owner: root
    group: root
    mode: '0644'
  when: tailscale_docker_user_firewall_fail_closed | bool
  notify: Reload systemd for the Hermes firewall units

- name: Remove the fail-closed coupling drop-in while the coupling is disabled
  tags: [tailscale]
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/10-hermes-firewall-fail-closed.conf
    state: absent
  when: not (tailscale_docker_user_firewall_fail_closed | bool)
  notify: Reload systemd for the Hermes firewall units

# NOTE: flushing handlers here also runs any handler queued by EARLIER roles in the same play (for example
# ssh_hardening's sshd restart) at this point rather than at the end of the play. That is safe here — the
# firewall's SSH allow rules above are already in place — but it is a side effect worth knowing about.
- name: Apply pending systemd unit changes before enabling the boot unit
  tags: [tailscale]
  ansible.builtin.meta: flush_handlers

# A deploy HEALS an unchanged artifact: the original fault was "rendered files unchanged, live
# chain empty" (after a reboot), so this compares the LIVE chain before and after loading rather
# than trusting that a file changed or that the boot unit reports itself started. It always loads
# (atomic, idempotent) and reports "changed" only when the live chain actually differed.
- name: Load the DOCKER-USER rules atomically (heals a drifted or emptied chain)
  tags: [tailscale]
  ansible.builtin.shell:
    cmd: |
      set -eu
      _before="$({{ tailscale_docker_user_firewall_loader }} status)"
      {{ tailscale_docker_user_firewall_loader }} apply
      _after="$({{ tailscale_docker_user_firewall_loader }} status)"
      if [ "$_before" != "$_after" ]; then echo CHANGED; fi
    executable: /bin/sh
  environment:
    HERMES_FIREWALL_DIR: "{{ tailscale_docker_user_firewall_dir }}"
  register: tailscale_docker_user_rules_load
  changed_when: "'CHANGED' in tailscale_docker_user_rules_load.stdout"
  when: not ansible_check_mode

- name: Enable the boot firewall unit and start it so it reports active
  tags: [tailscale]
  ansible.builtin.systemd:
    name: hermes-docker-user-firewall.service
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Enable UFW
  tags: [tailscale]
  community.general.ufw:
    state: enabled
