---
- name: Validate Tailscale role prerequisites
  tags: [tailscale]
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.tailscale_authkey is defined
      - secrets.tailscale_authkey | string | length > 0
    fail_msg: >-
      Tailscale role requires a Debian/Ubuntu host and secrets.tailscale_authkey
      (set TAILSCALE_AUTHKEY).

# --- Tailscale daemon (VPN overlay) -------------------------------------------
- name: Install ufw (host firewall package)
  tags: [tailscale]
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Check whether Tailscale is already installed
  tags: [tailscale]
  ansible.builtin.command:
    cmd: which tailscale
  register: tailscale_present
  changed_when: false
  failed_when: false

- name: Download the official Tailscale install script
  tags: [tailscale]
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: '0755'
  when: tailscale_present.rc != 0

- name: Install Tailscale
  tags: [tailscale]
  ansible.builtin.command:
    cmd: /tmp/tailscale-install.sh
  when: tailscale_present.rc != 0
  changed_when: true

- name: Ensure tailscaled service is enabled and running
  tags: [tailscale]
  ansible.builtin.service:
    name: tailscaled
    state: started
    enabled: true
  when: tailscale_present.rc == 0 and not ansible_check_mode
  ignore_errors: "{{ ansible_check_mode }}"

- name: Probe Tailscale backend state
  tags: [tailscale]
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

# Idempotent: only bring the node up if it is not already in the Running state.
- name: Bring up Tailscale (login via auth key)
  tags: [tailscale]
  ansible.builtin.command:
    cmd: "tailscale up --authkey={{ secrets.tailscale_authkey }} --hostname={{ inventory_hostname }}"
  when: >-
    tailscale_status is not defined or
    tailscale_status.rc != 0 or
    ((tailscale_status.stdout | string | length > 0) and
     ((tailscale_status.stdout | from_json).BackendState | default('') != 'Running'))
  changed_when: true

# --- Host firewall (single owner of the perimeter) ----------------------------
# Default-deny inbound; allow the SSH fallback (key-only via ssh_hardening), the
# Caddy/MFA ingress (80/443), and the Tailscale VPN interface. The Tailscale subnet
# constant is also consumed by the gateway Caddy MFA bypass (epic 07 #02).
- name: Allow the Tailscale VPN interface
  tags: [tailscale]
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ tailscale_interface }}"
    comment: "Tailscale private access"

- name: Rate-limit SSH, HTTP, HTTPS, and OwnTracks HTTPS
  tags: [tailscale]
  community.general.ufw:
    rule: limit
    port: "{{ item }}"
    proto: tcp
    comment: "{{ 'Limit SSH attempts' if item == common_ssh_port else 'Rate-limit web traffic' }}"
  loop:
    - "{{ common_ssh_port }}"
    - 80
    - 443
    - 8448

# --- Syncplay IP allowlist (epic 12, #06) --------------------------------------
# IP-restricted public access: each allowed IP gets allow + rate-limit in one
# rule (ufw limit = allow with a 6-connections/30s flood guard); every other
# source falls through to the default-deny incoming policy below. Deliberately
# NO catch-all `limit 8999` rule: ufw limit *allows* traffic (rate-limited),
# so it would open the port to the whole internet and defeat the allowlist.
- name: Allow and rate-limit Syncplay from allowed IPs
  tags: [tailscale]
  community.general.ufw:
    rule: limit
    from: "{{ item }}"
    port: 8999
    proto: tcp
    comment: "Syncplay friend access"
  loop: "{{ syncplay_allowed_ips | default([]) }}"

- name: Set UFW default incoming policy (default-deny)
  tags: [tailscale]
  community.general.ufw:
    direction: incoming
    policy: "{{ common_ufw_default_incoming_policy | lower }}"  # noqa: args[module]

- name: Set UFW default outgoing policy
  tags: [tailscale]
  community.general.ufw:
    direction: outgoing
    policy: "{{ common_ufw_default_outgoing_policy | lower }}"  # noqa: args[module]

# --- Docker published ports (epic 12, #08) ------------------------------------------
# Docker-published ports bypass UFW entirely: DNAT happens in nat PREROUTING and
# Docker's own FORWARD rules ACCEPT the traffic before UFW's INPUT is ever
# consulted. The supported enforcement point is the DOCKER-USER chain (processed
# before Docker's rules). This role is the single firewall owner, so it owns that
# chain too.
#
# Declarative rebuild: the chain is flushed and rebuilt on every run (end state
# identical each time; no duplicate/clobbered rules). Traffic from Docker bridge
# networks (container-to-container, e.g. caddy -> conduit:8008) RETURNs early so
# Docker's own forwarding applies — only host-uplink traffic is classified by port.
#
# Port classes (group_vars/all/main.yml): public (80/443/8448), Tailscale-only
# (3000, conduit 8008, 8642, 9119), and syncplay 8999 (syncplay_allowed_ips).
# NOTE: 1:1 host:container mappings only — post-DNAT dport == original dport.
# The rules are not persisted across reboot; the deployment model restores them
# by playbook run (Docker recreates the empty chain at daemon start).
- name: Reset the DOCKER-USER chain (declarative rebuild)
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    chain_management: true
    flush: true

- name: DOCKER-USER v4 - container networks return to Docker's own rules
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    in_interface: "{{ item }}"
    jump: RETURN
    comment: "docker bridge traffic is not host-ingress"
  loop:
    - br+
    - docker+

- name: DOCKER-USER v4 - established/related accepted
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ctstate: [ESTABLISHED, RELATED]
    jump: ACCEPT
    comment: "accept established forwarded flows"

- name: DOCKER-USER v4 - syncplay allowed IPs
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    source: "{{ item }}"
    protocol: tcp
    destination_port: 8999
    jump: ACCEPT
    comment: "syncplay friend access"
  loop: "{{ syncplay_allowed_ips | default([]) }}"

- name: DOCKER-USER v4 - syncplay denied for everyone else
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_port: 8999
    jump: DROP
    comment: "syncplay IP allowlist (empty list = fully blocked)"

- name: DOCKER-USER v4 - restricted ports from Tailscale subnet
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    source: "{{ tailscale_subnet }}"
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "tailscale-only service"
  loop: "{{ docker_published_restricted_ports }}"

- name: DOCKER-USER v4 - restricted ports denied for everyone else
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_port: "{{ item }}"
    jump: DROP
    comment: "tailscale-only service deny"
  loop: "{{ docker_published_restricted_ports }}"

- name: DOCKER-USER v4 - public ingress ports
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "public ingress (Caddy)"
  loop: "{{ docker_published_public_ports }}"

- name: Reset the DOCKER-USER chain for IPv6 (declarative rebuild)
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    chain_management: true
    flush: true
    ip_version: ipv6

- name: DOCKER-USER v6 - container networks return to Docker's own rules
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ip_version: ipv6
    in_interface: "{{ item }}"
    jump: RETURN
    comment: "docker bridge traffic is not host-ingress"
  loop:
    - br+
    - docker+

- name: DOCKER-USER v6 - established/related accepted
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ip_version: ipv6
    ctstate: [ESTABLISHED, RELATED]
    jump: ACCEPT
    comment: "accept established forwarded flows"

- name: DOCKER-USER v6 - syncplay denied (allowlist is IPv4-only)
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ip_version: ipv6
    protocol: tcp
    destination_port: 8999
    jump: DROP
    comment: "syncplay allowlist is IPv4-only"

- name: DOCKER-USER v6 - restricted ports from Tailscale ULA
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ip_version: ipv6
    source: "{{ tailscale_subnet_v6 }}"
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "tailscale-only service"
  loop: "{{ docker_published_restricted_ports }}"

- name: DOCKER-USER v6 - restricted ports denied for everyone else
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ip_version: ipv6
    protocol: tcp
    destination_port: "{{ item }}"
    jump: DROP
    comment: "tailscale-only service deny"
  loop: "{{ docker_published_restricted_ports }}"

- name: DOCKER-USER v6 - public ingress ports
  tags: [tailscale]
  ansible.builtin.iptables:
    chain: DOCKER-USER
    ip_version: ipv6
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    comment: "public ingress (Caddy)"
  loop: "{{ docker_published_public_ports }}"

- name: Enable UFW
  tags: [tailscale]
  community.general.ufw:
    state: enabled
