---
# Backup role — thin adapter over the backup_sync module.
# All sync/PR/git-crypt behavior lives in backup_sync/backup_sync (CLI); this role only wires
# Ansible facts (paths, branch, resolved secrets) to that module and manages the systemd units.
# The GitHub token reaches git via the environment (credential helper / askpass), never in a
# remote URL — so it is not persisted in .git/config (closes the README Known Limitation).

- name: Ensure SilverBullet bin directory exists
  tags: [backup]
  ansible.builtin.file:
    path: "{{ silverbullet_compose_dir }}/bin"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0755'

- name: Deploy git credential helper (reads GITHUB_TOKEN from env, no token stored)
  tags: [backup]
  ansible.builtin.copy:
    src: git-credential-env
    dest: "{{ silverbullet_compose_dir }}/bin/git-credential-env"
    mode: '0755'
    owner: llm_wiki
    group: llm_wiki

- name: Bootstrap clone of the private wiki repository (token-less URL)
  tags: [backup]
  # No token in the URL: git authenticates via GIT_ASKPASS -> git-credential-env, which reads
  # GITHUB_TOKEN from the environment. The token value is never written to .git/config.
  ansible.builtin.git:
    repo: "https://github.com/{{ secrets.github_repo_slug }}.git"
    dest: "{{ silverbullet_data_dir }}"
    version: "main"
    clone: true
    update: false
  environment:
    GITHUB_TOKEN: "{{ secrets.hermes_default_github_token }}"
    GIT_ASKPASS: "{{ silverbullet_compose_dir }}/bin/git-credential-env"
    GIT_TERMINAL_PROMPT: "0"
  failed_when: false
  ignore_errors: "{{ ansible_check_mode }}"

- name: Set correct ownership on cloned repository files
  tags: [backup]
  ansible.builtin.file:
    path: "{{ silverbullet_data_dir }}"
    owner: llm_wiki
    group: llm_wiki
    recurse: true

- name: Deploy .gitattributes
  tags: [backup]
  ansible.builtin.template:
    src: .gitattributes.j2
    dest: "{{ silverbullet_data_dir }}/.gitattributes"
    mode: '0644'
    owner: llm_wiki
    group: llm_wiki

- name: Deploy backup_sync module
  tags: [backup]
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/backup_sync/backup_sync"
    dest: "{{ backup_sync_bin }}"
    mode: '0755'
    owner: llm_wiki
    group: llm_wiki

- name: Stat the cloned wiki repo so git_config can be gated on its existence
  tags: [backup]
  ansible.builtin.stat:
    path: "{{ silverbullet_data_dir }}/.git"
  register: backup_wiki_repo_stat
  changed_when: false
  failed_when: false

- name: Configure repo-local git credential helper (env token, not stored in .git/config)
  tags: [backup]
  community.general.git_config:
    repo: "{{ silverbullet_data_dir }}"
    scope: local
    name: credential.helper
    value: "{{ silverbullet_compose_dir }}/bin/git-credential-env"
  when: backup_wiki_repo_stat.stat.exists

- name: Initialize git-crypt and export the offline-recovery key (idempotent)
  tags: [backup]
  ansible.builtin.command:
    cmd: "{{ backup_sync_bin }} git-crypt-init --repo {{ silverbullet_data_dir }} --key-out {{ silverbullet_compose_dir }}/git-crypt.key"
    creates: "{{ silverbullet_data_dir }}/.git/git-crypt/keys/default"
  when: backup_wiki_repo_stat.stat.exists
  become: true
  become_user: llm_wiki
  register: backup_git_crypt

- name: Restrict permissions on the exported git-crypt key
  tags: [backup]
  ansible.builtin.file:
    path: "{{ silverbullet_compose_dir }}/git-crypt.key"
    owner: llm_wiki
    group: llm_wiki
    mode: '0600'
  when: backup_wiki_repo_stat.stat.exists

- name: Fetch git-crypt key back to the control node for safekeeping
  tags: [backup]
  ansible.builtin.fetch:
    src: "{{ silverbullet_compose_dir }}/git-crypt.key"
    dest: "./{{ inventory_hostname }}-git-crypt.key"
    flat: true
  when: backup_git_crypt is changed  # noqa: no-handler

- name: Deploy llm-wiki watcher path unit
  tags: [backup]
  ansible.builtin.template:
    src: llm-wiki-watcher.path.j2
    dest: /etc/systemd/system/llm-wiki-watcher.path
    mode: '0644'

- name: Deploy llm-wiki watcher service unit
  tags: [backup]
  ansible.builtin.template:
    src: llm-wiki-watcher.service.j2
    dest: /etc/systemd/system/llm-wiki-watcher.service
    mode: '0644'

- name: Enable and start llm-wiki watcher path
  tags: [backup]
  ansible.builtin.systemd:
    name: llm-wiki-watcher.path
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Schedule nightly PR creation via backup_sync
  tags: [backup]
  ansible.builtin.cron:
    name: create daily backup PR
    minute: '59'
    hour: '23'
    job: >-
      GITHUB_TOKEN={{ secrets.backup_github_token }}
      {{ backup_sync_bin }} create-pr
      --repo {{ silverbullet_data_dir }}
      --branch {{ backup_working_branch }}
      --message '{{ backup_commit_message }}'
    user: "{{ secrets.admin_username }}"
