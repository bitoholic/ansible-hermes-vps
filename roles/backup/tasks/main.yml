- name: Schedule nightly PR creation
  ansible.builtin.cron:
    name: create daily backup PR
    minute: '59'
    hour: '23'
    job: "{{ silverbullet_compose_dir }}/bin/create-daily-pr.sh"
    user: "{{ admin_username }}"
