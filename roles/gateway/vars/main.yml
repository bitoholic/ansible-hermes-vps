---
# Gateway route schema (epic 13, #01): the single source of truth for what a
# gateway_routes entry may contain. Consumed by roles/gateway/tasks/validate.yml
# (epic 13, #02) to drive generic per-field validation instead of hand-written
# assert clauses per field — adding a field here is enough for validate.yml to
# enforce it; there's no second hand-copied assert list left to drift from this.
#
# Named vars/main.yml (not vars/route_schema.yml, as originally written) so
# Ansible's own role-compilation auto-loads it whenever the gateway role is
# invoked for real (roles:/include_role/import_role) — a differently-named file
# under vars/ is never auto-loaded, only vars/main.yml is. Caught by a live
# --check run against the VPS: the original filename worked in every local test
# only because each test explicitly include_vars'd it itself as a workaround,
# masking that the real gateway role never actually loaded it.
#
# Each entry: `field` name, `required` (boolean), and one or more constraints —
# `type` (string/boolean/integer), `allowed_values` (an enum list), and/or
# `non_empty` (rejects an empty string; only meaningful alongside `type: string`,
# and only `upstream` uses it today). The `string` constraints on
# host/basic_auth_user/basic_auth_hash are a deliberate, low-risk narrow addition
# beyond what validate.yml checked before this epic (which never type-checked
# those three) — see epic 13 ticket #01's Notes. validate_route.yml (ticket #02)
# checks `non_empty` as its own constraint kind alongside `type`/`allowed_values`.
#
# basic_auth_user/basic_auth_hash mutual presence is NOT expressed here — it's
# the one relational constraint among these fields (not a per-field check) and
# stays a small, explicit, one-off assert in validate.yml (epic 13 ticket #02).
#
# tailnet_only (epic 18, #01): a second, stricter private-route model alongside
# `mfa`. `mfa: true` is public-with-Authelia-challenge-unless-Tailscale (ADR-0001)
# — still reachable from the public internet. `tailnet_only: true` renders a hard
# 404 for any non-Tailscale source in Caddyfile.j2 (no forward_auth involved) —
# genuinely no public path. The two are independent booleans, not a shared enum:
# a route can in principle set both, and it's safe by construction — the
# tailnet_only snippet uses its own uniquely-named matcher (@not_tailscale_hard),
# not mfa_auth's @not_tailscale, so importing both into one server block can't
# redefine the same matcher name twice. Not worth a mutual-exclusivity constraint
# for a combination that's already harmless rather than merely assumed to be.
gateway_route_schema:
  - field: host
    required: true
    type: string
  - field: upstream
    required: true
    type: string
    non_empty: true
  - field: mfa
    required: true
    type: boolean
  - field: tls_mode
    required: false
    allowed_values:
      - internal
      - auto
  - field: port
    required: false
    type: integer
  - field: basic_auth_user
    required: false
    type: string
  - field: basic_auth_hash
    required: false
    type: string
  - field: tailnet_only
    required: false
    type: boolean
