---
# Gateway / reverse-proxy seam (epic 03, #01 / #02).
# The gateway is the single writer of the ingress Caddyfile. It owns the route-data interface
# (`gateway_routes`) and the shared `mfa_auth` forward-auth snippet, and renders one Caddy site
# block per route. Caddy still runs inside the SilverBullet compose stack, so the file lands in
# `gateway_caddyfile_dir` (default `silverbullet_compose_dir`); SilverBullet no longer authors
# any routing.
- name: Load per-role gateway_publish contributions
  tags: [gateway]
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/{{ item }}/defaults/main.yml"
  loop:
    - silverbullet
    - authelia
    - hermes
    - conduit
    - owntracks
    - beszel
    - adguard
  no_log: true   # the loaded vars include owntracks_gateway_publish's basic_auth_hash

- name: Validate gateway_routes shape
  tags: [gateway]
  ansible.builtin.include_tasks: validate.yml

# Shared Unix socket directory for caddy<->caddy-relay (epic 20) — same
# wiki_volume ensure_directory pattern as beszel's own hub<->agent socket dir.
# Relies on wiki_volume's uid/gid facts already being resolved by the time
# this role's tasks run: gateway depends on owntracks (meta/main.yml), which
# itself depends on wiki_volume, so this is already transitively satisfied.
- name: Ensure caddy-relay socket directory exists
  tags: [gateway]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ caddy_relay_socket_dir }}"
    wiki_volume_directory_mode: '0755'

- name: Ensure ingress (Caddyfile) deploy directory exists
  tags: [gateway]
  ansible.builtin.file:
    path: "{{ gateway_caddyfile_dir }}"
    state: directory
    owner: "{{ gateway_caddyfile_owner }}"
    group: "{{ gateway_caddyfile_group }}"
    mode: '0775'

- name: Deploy Caddyfile (gateway adapter)
  tags: [gateway]
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ gateway_caddyfile_dir }}/Caddyfile"
    mode: '0644'
  no_log: true   # interpolates route.basic_auth_hash (owntracks) and secrets.acme_email/silverbullet_domain
  notify: Restart caddy

# caddy-relay's config (epic 20) — same deploy directory as the Caddyfile above,
# since both are bind-mounted into the consolidated compose stack the same way.
# Depends on roles/tailscale/tasks/main.yml having already set tailscale_ip_v4/
# tailscale_ip_v6 (the tailscale role runs before gateway in site.yml).
- name: Deploy haproxy.cfg (caddy-relay adapter)
  tags: [gateway]
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ gateway_caddyfile_dir }}/haproxy.cfg"
    mode: '0644'
  notify: Restart caddy-relay
