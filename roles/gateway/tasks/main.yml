---
# Gateway / reverse-proxy seam (epic 03, #01 / #02).
# The gateway is the single writer of the ingress Caddyfile. It owns the route-data interface
# (`gateway_routes`) and the shared `mfa_auth` forward-auth snippet, and renders one Caddy site
# block per route. Caddy still runs inside the SilverBullet compose stack, so the file lands in
# `silverbullet_compose_dir`; SilverBullet no longer authors any routing.
- name: Load per-role gateway_publish contributions
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/{{ item }}/defaults/main.yml"
  loop:
    - silverbullet
    - authelia
    - hermes

- name: Validate gateway_routes shape (fail fast on malformed ingress)
  ansible.builtin.assert:
    that:
      - gateway_routes is defined
      - gateway_routes | length > 0
      - gateway_routes | selectattr('host', 'undefined') | list | length == 0
      - gateway_routes | selectattr('upstream', 'undefined') | list | length == 0
      - gateway_routes | selectattr('upstream', 'equalto', '') | list | length == 0
      - gateway_routes | selectattr('mfa', 'undefined') | list | length == 0
      - gateway_routes | rejectattr('mfa', 'boolean') | list | length == 0
    fail_msg: >-
      Each entry in gateway_routes must declare `host`, a non-empty `upstream`, and a
      boolean `mfa`. A malformed entry means a broken Caddyfile (silent 502). Fix the
      offending role's `gateway_publish` contribution.

- name: Ensure ingress (Caddyfile) deploy directory exists
  ansible.builtin.file:
    path: "{{ silverbullet_compose_dir }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0775'

- name: Deploy Caddyfile (gateway adapter)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ silverbullet_compose_dir }}/Caddyfile"
    mode: '0644'
