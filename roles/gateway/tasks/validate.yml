---
# Gateway / reverse-proxy seam (epic 03, #03; rewritten as a schema-driven engine in
# epic 13, #02). Fail-fast validation of `gateway_routes` — runs before the Caddyfile
# is rendered so a malformed ingress entry can't produce a silent-502 Caddyfile.
# Extracted so the render test can invoke just the validation (without the
# deploy-dir/file step).
#
# Walks roles/gateway/vars/route_schema.yml generically (via validate_route.yml)
# instead of one hand-written assert per field — adding a field to the schema is
# enough for this to enforce it; there's no second hand-copied assert list left to
# drift from it.
- name: Assert gateway_routes is a non-empty list
  ansible.builtin.assert:
    that:
      - gateway_routes is defined
      - gateway_routes | length > 0
    fail_msg: "gateway_routes must be defined and non-empty."

- name: Validate each route against the route schema
  ansible.builtin.include_tasks: validate_route.yml
  loop: "{{ gateway_routes }}"
  loop_control:
    loop_var: gateway_route
    label: "{{ gateway_route.host | default('?') }}"

# basic_auth_user/basic_auth_hash mutual presence: the only relational rule among the
# 7 fields (everything else is a per-field check owned by the schema) — kept as one
# small, explicit check here rather than generalized into the schema vocabulary for a
# single instance. A lone one renders either a broken `basic_auth {  }` block (no
# creds, Caddy refuses to start) or silently skips auth entirely.
- name: Assert basic_auth_user/basic_auth_hash mutual presence
  ansible.builtin.assert:
    that:
      - ("basic_auth_user" in gateway_route) == ("basic_auth_hash" in gateway_route)
    fail_msg: >-
      route '{{ gateway_route.host | default('?') }}': basic_auth_user and
      basic_auth_hash must both be present or both absent.
  loop: "{{ gateway_routes }}"
  loop_control:
    loop_var: gateway_route
    label: "{{ gateway_route.host | default('?') }}"
