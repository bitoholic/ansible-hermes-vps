---
- name: Validate Conduit role prerequisites
  tags: [conduit]
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.conduit_registration_secret is defined
      - secrets.conduit_registration_secret | string | length > 0
      - secrets.matrix_bot_password is defined
      - secrets.matrix_bot_password | string | length > 0
    fail_msg: >-
      Conduit role requires a Debian/Ubuntu host, secrets.conduit_registration_secret
      (set CONDUIT_REGISTRATION_SECRET), and secrets.matrix_bot_password (set MATRIX_BOT_PASSWORD).

- name: Ensure Conduit deployment directory exists
  tags: [conduit]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ conduit_compose_dir }}"
    wiki_volume_directory_mode: '0755'

# The matrixconduit/matrix-conduit runner executes as the `llm_wiki` user (UID/GID 10000),
# so the bind-mounted data dir must be owned by that UID or the container can't write its DB.
- name: Ensure Conduit data directory exists
  tags: [conduit]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ conduit_data_dir }}"
    wiki_volume_directory_mode: '0700'

- name: Deploy Conduit configuration
  tags: [conduit]
  ansible.builtin.template:
    src: conduit.toml.j2
    dest: "{{ conduit_compose_dir }}/conduit.toml"
    owner: llm_wiki
    group: llm_wiki
    mode: '0644'

# Bot provisioning (@hermes registration) moved to tasks/provision.yml (epic 16, #01)
# — it needs the Conduit container actually running, which now happens later in the
# play (docker's compose-stack start is relocated to the end of the play). No longer
# runs automatically as part of this role's default sequence; invoked explicitly from
# site.yml's end-of-play tasks, after the compose stack starts.
