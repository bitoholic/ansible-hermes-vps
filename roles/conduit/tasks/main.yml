---
- name: Validate Conduit role prerequisites
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.conduit_registration_secret is defined
      - secrets.conduit_registration_secret | string | length > 0
    fail_msg: >-
      Conduit role requires a Debian/Ubuntu host and secrets.conduit_registration_secret
      (set the CONDUIT_REGISTRATION_SECRET environment variable).

- name: Ensure Conduit deployment directory exists
  ansible.builtin.file:
    path: "{{ conduit_compose_dir }}"
    state: directory
    owner: "{{ secrets.admin_username }}"
    group: "{{ secrets.admin_username }}"
    mode: '0755'

# The matrixconduit/matrix-conduit runner executes as the `conduit` user (UID/GID 1000),
# so the bind-mounted data dir must be owned by that UID or the container can't write its DB.
- name: Ensure Conduit data directory exists
  ansible.builtin.file:
    path: "{{ conduit_data_dir }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0700'

# The config file embeds the registration token (a secret). It is owned by the container's
# UID 1000 (plus root) so the process can read it, while other local users cannot.
- name: Deploy Conduit configuration
  ansible.builtin.template:
    src: conduit.toml.j2
    dest: "{{ conduit_compose_dir }}/conduit.toml"
    owner: '1000'
    group: '1000'
    mode: '0600'

- name: Deploy Conduit docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ conduit_compose_dir }}/docker-compose.yml"
    owner: "{{ secrets.admin_username }}"
    group: "{{ secrets.admin_username }}"
    mode: '0640'

- name: Start Conduit stack
  community.docker.docker_compose_v2:
    project_src: "{{ conduit_compose_dir }}"
    project_name: conduit
    files:
      - docker-compose.yml
    state: present
    pull: missing
  ignore_errors: "{{ ansible_check_mode }}"
