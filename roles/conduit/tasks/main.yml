---
- name: Validate Conduit role prerequisites
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.conduit_registration_secret is defined
      - secrets.conduit_registration_secret | string | length > 0
      - secrets.matrix_bot_password is defined
      - secrets.matrix_bot_password | string | length > 0
    fail_msg: >-
      Conduit role requires a Debian/Ubuntu host, secrets.conduit_registration_secret
      (set CONDUIT_REGISTRATION_SECRET), and secrets.matrix_bot_password (set MATRIX_BOT_PASSWORD).

- name: Ensure Conduit deployment directory exists
  ansible.builtin.file:
    path: "{{ conduit_compose_dir }}"
    state: directory
    owner: "{{ secrets.admin_username }}"
    group: "{{ secrets.admin_username }}"
    mode: '0755'

# The matrixconduit/matrix-conduit runner executes as the `conduit` user (UID/GID 1000),
# so the bind-mounted data dir must be owned by that UID or the container can't write its DB.
- name: Ensure Conduit data directory exists
  ansible.builtin.file:
    path: "{{ conduit_data_dir }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0700'

# The config file embeds the registration token (a secret). It is owned by the container's
# UID 1000 (plus root) so the process can read it, while other local users cannot.
- name: Deploy Conduit configuration
  ansible.builtin.template:
    src: conduit.toml.j2
    dest: "{{ conduit_compose_dir }}/conduit.toml"
    owner: '1000'
    group: '1000'
    mode: '0600'

- name: Deploy Conduit docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ conduit_compose_dir }}/docker-compose.yml"
    owner: "{{ secrets.admin_username }}"
    group: "{{ secrets.admin_username }}"
    mode: '0640'

- name: Start Conduit stack
  community.docker.docker_compose_v2:
    project_src: "{{ conduit_compose_dir }}"
    project_name: conduit
    files:
      - docker-compose.yml
    state: present
    pull: missing
  ignore_errors: "{{ ansible_check_mode }}"

# --- Bot provisioning (@hermes) -------------------------------------------------
# Hermes logs in with MATRIX_USER_ID + MATRIX_PASSWORD (no access token shared across
# roles), so the bot account is created here once via Conduit's registration endpoint
# using the shared registration token. Idempotent: skipped once the user exists.
- name: Resolve Conduit container IP on the internal network
  community.docker.docker_container_info:
    name: conduit
  register: conduit_container_info
  ignore_errors: "{{ ansible_check_mode }}"

- name: Compute Conduit container IP fact
  ansible.builtin.set_fact:
    conduit_ip: "{{ (conduit_container_info.container or {}).NetworkSettings.Networks.hermes_net.IPAddress | default('', true) }}"

- name: Compute Conduit API base URL
  ansible.builtin.set_fact:
    conduit_api_base: "http://{{ conduit_ip }}:{{ conduit_port }}"

- name: Wait for Conduit to accept connections
  ansible.builtin.wait_for:
    host: "{{ conduit_ip }}"
    port: "{{ conduit_port }}"
    state: started
    timeout: 60
  when: conduit_ip | length > 0
  ignore_errors: "{{ ansible_check_mode }}"

- name: Check whether the @hermes user is already registered
  ansible.builtin.uri:
    url: "{{ conduit_api_base }}/_matrix/client/v3/register/available?username=hermes"
    method: GET
    status_code: [200, 400]
  register: conduit_hermes_available
  when: conduit_ip | length > 0
  ignore_errors: "{{ ansible_check_mode }}"

- name: Register the @hermes bot account via the Conduit registration token
  ansible.builtin.uri:
    url: "{{ conduit_api_base }}/_matrix/client/v3/register"
    method: POST
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      auth:
        type: "m.login.registration_token"
        token: "{{ secrets.conduit_registration_secret }}"
      username: hermes
      password: "{{ secrets.matrix_bot_password }}"
      inhibit_login: true
    status_code: [200, 201]
  when: (conduit_hermes_available.status | default(0)) == 200
  changed_when: (conduit_hermes_available.status | default(0)) == 200
  ignore_errors: "{{ ansible_check_mode }}"
