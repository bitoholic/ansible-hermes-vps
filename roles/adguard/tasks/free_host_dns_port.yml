---
# AdGuard DNS host-port handover (epic 18, #05) — the highest-risk step in this
# epic: a host-level DNS config change with a real failure mode if sequenced
# wrong. This underwent TWO real corrections during implementation, both found
# by tracing actual Docker/systemd mechanics rather than assumption — recorded
# here so a future reader doesn't reintroduce either bug.
#
# Correction #1 (this file's position in site.yml): AdGuard's container cannot
# bind host port 53 while systemd-resolved's stub listener still holds
# 127.0.0.53:53 — Docker's docker-proxy binding 0.0.0.0:53 conflicts with ANY
# existing bind on port 53, stub listener included. This is the single most
# commonly documented Docker+DNS conflict on Debian/Ubuntu. So "AdGuard already
# bound before the host listener goes down" is not physically achievable for a
# single port — one side must vacate before the other can bind it. This file
# therefore runs BEFORE "Start consolidated docker compose stack" in site.yml
# (not after, as an earlier version of this ticket had it — that ordering made
# the stack-start step itself fail immediately, since resolved was still
# holding the port, aborting the whole play there). The goal is not a literal
# zero-gap handover (impossible for one port) but the shortest achievable gap:
# free the port here, then immediately continue to the compose-stack start
# that follows this file's inclusion — the window with no working host DNS is
# bounded to however long that immediate next step takes to bring AdGuard's
# listener up, not stretched across the rest of the play's remaining roles.
#
# Correction #2 (roles/docker/tasks/main.yml's new pre-pull step): once host
# DNS is down, "docker compose up" pulling a not-yet-cached image would itself
# need DNS it no longer has — a second chicken-and-egg on top of the first,
# affecting every enabled service's image on a fresh VPS bootstrap, not just
# AdGuard's. Fixed by pulling every image while DNS still works, earlier in the
# same play (docker's own tasks/main.yml) — see that file's comment.
#
# Verified sequence for the resolved-side change itself (Pi-hole's own
# documented order — the most common real-world instance of this exact
# conflict): write the drop-in, repoint /etc/resolv.conf, THEN restart.
# Repointing before the restart avoids a window where /etc/resolv.conf still
# points at the now-dead stub symlink (/run/systemd/resolve/stub-resolv.conf,
# 127.0.0.53) — DNS= in the drop-in is only honored through the non-stub file
# (/run/systemd/resolve/resolv.conf), never through the stub path, in any
# systemd-resolved version.

- name: Ensure systemd-resolved drop-in directory exists
  tags: [adguard]
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'

- name: Disable systemd-resolved's stub listener so AdGuard can bind port 53
  tags: [adguard]
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/adguardhome.conf
    content: |
      [Resolve]
      DNS=127.0.0.1
      DNSStubListener=no
    mode: '0644'
  register: adguard_resolved_dropin

- name: Repoint /etc/resolv.conf at systemd-resolved's non-stub file
  tags: [adguard]
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  register: adguard_resolv_conf_repoint

- name: Restart systemd-resolved to free port 53 for AdGuard
  tags: [adguard]
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  when: adguard_resolved_dropin is changed or adguard_resolv_conf_repoint is changed

# Manual, external-console step (not Ansible-automatable): point the tailnet's
# devices at AdGuard via Tailscale's admin console "override DNS servers"
# setting — a GLOBAL OVERRIDE nameserver pointed at this VPS's Tailscale IP, not
# split-DNS (which solves a different problem: routing specific domains
# elsewhere, not network-wide ad-blocking). Full instructions: README.md,
# "Manual Post-Deploy Steps".
