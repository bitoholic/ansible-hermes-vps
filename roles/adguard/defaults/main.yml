---
# AdGuard's ingress contribution (epic 18, #04): the admin UI only — DNS-serving
# (port 53, firewall rules, the host-level systemd-resolved change) is epic 18
# ticket #05's scope, not this one. tailnet_only (epic 18, #01) — no public
# path, no MFA. The raw container port (3001) is ALSO published directly and
# firewall-restricted (group_vars/all/main.yml's docker_published_restricted_ports)
# as an independent enforcement layer from this Caddy route. upstream targets
# the container's own default listen port (3000, unchanged) — the host-side
# port is remapped to 3001 purely to avoid colliding with SilverBullet's 3000;
# container-to-container traffic (Caddy -> adguard) uses the container's actual
# port regardless of the host-side remap.
adguard_gateway_publish:
  - host: adguard
    upstream: adguard:3000
    mfa: false
    tailnet_only: true

# Whether the resolv.conf repoint below must run (epic 21 #04). It is a variable, not an inline `when:`
# string, so tests can evaluate its truth table against synthetic host states. It runs when (a) the
# operator has enabled host-DNS ownership (host_dns_resolver_owner_enabled), or (b) the CURRENT
# resolv.conf would be BROKEN by the stub listener being off — missing, a symlink to the resolver
# daemon's stub file (a fresh host's default), or a regular file that still names the stub address
# (127.0.0.53). A working resolver configuration written by something else (e.g. Tailscale's own file on
# the live host) is left exactly as found, which ends the deploy-versus-Tailscale overwrite fight for
# routine runs.
adguard_resolv_conf_repoint_needed: >-
  {{ (host_dns_resolver_owner_enabled | default(false) | bool)
     or not (adguard_resolv_conf_stat.stat.exists | default(false))
     or ((adguard_resolv_conf_stat.stat.islnk | default(false))
         and ('stub-resolv.conf' in (adguard_resolv_conf_stat.stat.lnk_source | default(''))))
     or ((adguard_resolv_conf_names_stub.rc | default(1)) == 0) }}
