---
# Parse the just-generated htpasswd line rather than re-hash the password, so there
# is exactly one source of truth for the credential. Split out of tasks/main.yml so
# it's independently testable — it only needs owntracks_htpasswd_path and
# secrets.owntracks_admin_username, nothing from the directory-creation tasks.
#
# Bug fix, found via a live --check --diff run against the VPS before this epic's
# PR was merged: the htpasswd file can have more than one line — the operator
# manages family members' logins (beyond the one Ansible-managed admin credential)
# by hand, directly on the server. The previous version here treated the whole
# file as one blob and split on every ':' in it, corrupting the parsed hash the
# moment a second line existed. This finds the specific line for the
# Ansible-managed user by name, regardless of how many other lines exist or where
# it sits among them — those other lines are left untouched in the file, just not
# (yet) reflected in Caddy's basic_auth block. Real multi-user support is a
# follow-up, not this.
- name: Read generated htpasswd for Caddy's basic_auth directive
  tags: [owntracks]
  ansible.builtin.slurp:
    src: "{{ owntracks_htpasswd_path }}"
  register: owntracks_htpasswd_slurp

- name: Isolate the Ansible-managed user's htpasswd line
  tags: [owntracks]
  ansible.builtin.set_fact:
    owntracks_htpasswd_line: >-
      {{ (owntracks_htpasswd_slurp.content | b64decode).splitlines()
         | select('match', '^' ~ (secrets.owntracks_admin_username | regex_escape) ~ ':')
         | first }}

- name: Expose parsed htpasswd credentials for the gateway_publish contribution
  tags: [owntracks]
  ansible.builtin.set_fact:
    owntracks_basic_auth_user: "{{ secrets.owntracks_admin_username }}"
    owntracks_basic_auth_hash: "{{ owntracks_htpasswd_line.split(':', 1)[1] }}"
