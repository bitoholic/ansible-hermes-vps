---
# OwnTracks htpasswd generation (epic 12, #02).
- name: Ensure owntracks data directory exists
  tags: [owntracks]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ docker_compose_dir }}/owntracks"
    wiki_volume_directory_mode: '0755'

# Recorder storage bind-mounted at /store by the compose fragment. Must exist
# with the container uid's ownership BEFORE first run: the named volume it
# replaces was initialized root-owned and the recorder failed with
# "Cannot mkdir /store/ghash: Permission denied".
- name: Ensure owntracks recorder storage directory exists
  tags: [owntracks]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ owntracks_data_dir }}"
    wiki_volume_directory_mode: '0755'

- name: Install passlib (required by the htpasswd module on the target host)
  tags: [owntracks]
  ansible.builtin.apt:
    name:
      - python3-passlib
      - python3-bcrypt
    state: present
    update_cache: true
  when: ansible_os_family | default('') == 'Debian'

- name: Generate htpasswd for owntracks basic auth
  tags: [owntracks]
  community.general.htpasswd:
    path: "{{ owntracks_htpasswd_path }}"
    name: "{{ secrets.owntracks_admin_username }}"
    password: "{{ secrets.owntracks_admin_password }}"
    # crypt_scheme (not hash_scheme, which epic 22 #05's own dynamic leak test hit this task with originally): both
    # names work — community.general's htpasswd module made hash_scheme the canonical name with crypt_scheme kept
    # as a backward-compat alias (roughly v8.0+) — but crypt_scheme also works unmodified on the older collection
    # versions that only ever had that name, so it's the more portable choice across whatever version is installed.
    crypt_scheme: bcrypt
    owner: root
    group: root
    mode: '0600'   # epic 22 #07: was 0644 (world-readable, no owner set); no running container reads this file
    # directly (parse_htpasswd.yml slurps the admin's own line once and bakes the resulting hash into the gateway
    # Caddyfile, already root:root 0600 in this same ticket) — its real readers are Ansible/root and the operator
    # editing it by hand (who already needs sudo for the other files this ticket tightened the same way). The
    # operator does hand-add other real users' lines here over time (see parse_htpasswd.yml's own comment); root
    # ownership doesn't block that, only unprivileged reads.
  no_log: true   # the plaintext password is a module argument, shown verbatim at verbosity without this
  register: owntracks_htpasswd_result

# The recorder itself has NO HTTP authentication of any kind — OTR_AUTH_FILE is
# not a real config key (verified against upstream misc.c / doc/SECURITY.md,
# which says a reverse proxy must supply auth). Caddy's basic_auth directive is
# the actual enforcement point, so it needs this file's contents, not the
# recorder. Parsing is its own task file (parse_htpasswd.yml) so it's directly
# testable without pulling in the directory-creation tasks' wiki_volume/users
# dependency chain — it needs nothing from them.
- name: Parse the generated htpasswd file for Caddy's basic_auth directive
  tags: [owntracks]
  ansible.builtin.include_tasks: parse_htpasswd.yml
