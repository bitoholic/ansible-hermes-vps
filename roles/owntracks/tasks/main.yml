---
# OwnTracks htpasswd generation (epic 12, #02).
- name: Ensure owntracks data directory exists
  tags: [owntracks]
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/owntracks"
    state: directory
    owner: "{{ wiki_volume_uid }}"
    group: "{{ wiki_volume_gid }}"
    mode: '0755'

# Recorder storage bind-mounted at /store by the compose fragment. Must exist
# with the container uid's ownership BEFORE first run: the named volume it
# replaces was initialized root-owned and the recorder failed with
# "Cannot mkdir /store/ghash: Permission denied".
- name: Ensure owntracks recorder storage directory exists
  tags: [owntracks]
  ansible.builtin.file:
    path: "{{ owntracks_data_dir }}"
    state: directory
    owner: "{{ wiki_volume_uid }}"
    group: "{{ wiki_volume_gid }}"
    mode: '0755'

- name: Install passlib (required by the htpasswd module on the target host)
  tags: [owntracks]
  ansible.builtin.apt:
    name:
      - python3-passlib
      - python3-bcrypt
    state: present
    update_cache: true
  when: ansible_os_family | default('') == 'Debian'

- name: Generate htpasswd for owntracks basic auth
  tags: [owntracks]
  community.general.htpasswd:
    path: "{{ owntracks_htpasswd_path }}"
    name: "{{ secrets.owntracks_admin_username }}"
    password: "{{ secrets.owntracks_admin_password }}"
    hash_scheme: bcrypt
    mode: '0644'
  register: owntracks_htpasswd_result
