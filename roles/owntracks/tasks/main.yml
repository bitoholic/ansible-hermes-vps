---
# OwnTracks htpasswd generation (epic 12, #02).
- name: Ensure owntracks data directory exists
  tags: [owntracks]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ docker_compose_dir }}/owntracks"
    wiki_volume_directory_mode: '0755'

# Recorder storage bind-mounted at /store by the compose fragment. Must exist
# with the container uid's ownership BEFORE first run: the named volume it
# replaces was initialized root-owned and the recorder failed with
# "Cannot mkdir /store/ghash: Permission denied".
- name: Ensure owntracks recorder storage directory exists
  tags: [owntracks]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ owntracks_data_dir }}"
    wiki_volume_directory_mode: '0755'

- name: Install passlib (required by the htpasswd module on the target host)
  tags: [owntracks]
  ansible.builtin.apt:
    name:
      - python3-passlib
      - python3-bcrypt
    state: present
    update_cache: true
  when: ansible_os_family | default('') == 'Debian'

- name: Generate htpasswd for owntracks basic auth
  tags: [owntracks]
  community.general.htpasswd:
    path: "{{ owntracks_htpasswd_path }}"
    name: "{{ secrets.owntracks_admin_username }}"
    password: "{{ secrets.owntracks_admin_password }}"
    hash_scheme: bcrypt
    mode: '0644'
  register: owntracks_htpasswd_result

# The recorder itself has NO HTTP authentication of any kind — OTR_AUTH_FILE is
# not a real config key (verified against upstream misc.c / doc/SECURITY.md,
# which says a reverse proxy must supply auth). Caddy's basic_auth directive is
# the actual enforcement point, so it needs this file's contents, not the
# recorder. Parse the just-generated line rather than re-hash the password so
# there is exactly one source of truth for the credential.
- name: Read generated htpasswd for Caddy's basic_auth directive
  tags: [owntracks]
  ansible.builtin.slurp:
    src: "{{ owntracks_htpasswd_path }}"
  register: owntracks_htpasswd_slurp

- name: Expose parsed htpasswd credentials for the gateway_publish contribution
  tags: [owntracks]
  ansible.builtin.set_fact:
    owntracks_basic_auth_user: "{{ (owntracks_htpasswd_slurp.content | b64decode | trim).split(':')[0] }}"
    owntracks_basic_auth_hash: "{{ (owntracks_htpasswd_slurp.content | b64decode | trim).split(':')[1] }}"
