---
- name: Assert mandatory secrets are present
  tags: [authelia]
  ansible.builtin.assert:
    that:
      - secrets.authelia_admin_password_hash | default('') | string | length > 0
      - secrets.authelia_session_secret | default('') | string | length > 0
      - secrets.authelia_storage_key | default('') | string | length > 0
    fail_msg: Provide the required secrets via --extra-vars or inventory group_vars before running the playbook

- name: Ensure Authelia configuration and data directories exist
  tags: [authelia]
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0750'
  loop:
    - "{{ authelia_config_dir }}"
    - "{{ authelia_data_dir }}"

- name: Render Authelia configuration
  tags: [authelia]
  ansible.builtin.template:
    src: authelia-configuration.yml.j2
    dest: "{{ authelia_config_dir }}/configuration.yml"
    mode: '0600'

- name: Render Authelia users database
  tags: [authelia]
  ansible.builtin.template:
    src: authelia-users.yml.j2
    dest: "{{ authelia_config_dir }}/users.yml"
    mode: '0600'
