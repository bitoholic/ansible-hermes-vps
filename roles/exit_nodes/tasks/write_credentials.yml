---
# Split out of tasks/main.yml so a test playbook can exercise just the credentials.env.j2
# rendering (see tests/test_exit_nodes_render.yml) without the directory/file ownership tasks
# below, which need a real "docker" group on the host (mirrors roles/gateway/tasks/validate.yml's
# own reason for being extracted out of tasks/main.yml).

- name: Ensure the exit-node credentials directory exists
  ansible.builtin.file:
    path: "{{ exit_nodes_credentials_dir }}"
    state: directory
    owner: root
    group: docker
    mode: '0750'

# Epic 22 #07 permission model (see roles/docker/tasks/main.yml): root:docker 0640, not
# world-readable — `docker compose` parses env_file content client-side as the invoking
# (docker-group) admin user, so group-read is what keeps that working, not root alone.
- name: Write the shared exit-node credentials file
  ansible.builtin.template:
    src: credentials.env.j2
    dest: "{{ exit_nodes_credentials_file }}"
    owner: root
    group: docker
    mode: '0640'
  no_log: true   # interpolates every exit-node secret value
