---
# Epic 16, #01: Hermes skill-pack installation (epic 08), extracted out of this
# role's default task sequence because it needs the hermes-agent container actually
# running (docker exec) — unlike tasks/main.yml's config-deployment tasks, which must
# run BEFORE the compose stack starts. Installs obra/superpowers + mattpocock/skills
# via Hermes's own CLI so they are upgradeable and available on-demand to every
# profile. Each entry in `hermes_skills` is installed only if not already registered
# (exact-match guard on the first column of `hermes skills list`), and the gateway is
# restarted so the new skills load. spec-kit is intentionally excluded (Hermes
# <=0.20.6 does not register `specify`-generated skills).
#
# Invoked from site.yml's end-of-play tasks via a bare include_tasks (not
# import_role/tasks_from — that re-triggers this role's meta dependency on docker,
# rerunning docker's entire role a second time; see site.yml's comment), after the
# relocated docker compose-stack start.
- name: Pause for Hermes gateway to become ready before installing skills
  tags: [hermes]
  ansible.builtin.pause:
    seconds: 20

- name: Install Hermes skill packs via Hermes CLI
  tags: [hermes]
  ansible.builtin.shell: >-
    docker exec hermes-agent hermes skills list |
    awk -F'│' '{n=$2; gsub(/^[ \t]+|[ \t]+$/, "", n); if (n=="{{ item.name }}") f=1} END{exit !f}' ||
    docker exec hermes-agent hermes skills install {{ item.source }} --force
  loop: "{{ hermes_skills | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _hermes_skill_install
  changed_when: "'Installed' in _hermes_skill_install.stdout"
  ignore_errors: true
  when: hermes_skills | default([]) | length > 0

- name: Restart Hermes gateway to load newly installed skills
  tags: [hermes]
  ansible.builtin.command: docker restart hermes-agent
  changed_when: true
  when:
    - hermes_skills | default([]) | length > 0
    - _hermes_skill_install is changed
