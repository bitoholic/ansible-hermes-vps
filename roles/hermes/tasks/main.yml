---
- name: Validate Hermes role prerequisites
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.admin_username is defined
      - secrets.admin_username | string | length > 0
      - secrets.hermes_default_openrouter_api_key | default('') | length > 0
      - hermes_signal_http_url | default('') | length > 0
      - secrets.hermes_signal_account | default('') | length > 0
      - secrets.hermes_signal_allowed_users | default('') | length > 0
      - secrets.matrix_bot_password | default('') | length > 0
      - secrets.matrix_allowed_users | default('') | length > 0
    fail_msg: >-
      Hermes role requires Debian/Ubuntu hosts, admin_username, hermes_port,
      secrets.hermes_default_openrouter_api_key, hermes_signal_http_url, secrets.hermes_signal_account,
      secrets.hermes_signal_allowed_users, secrets.matrix_bot_password, and secrets.matrix_allowed_users.

- name: Ensure persistent Hermes data root exists for admin user
  ansible.builtin.file:
    path: "{{ hermes_home }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0700'
    recurse: true

- name: Ensure Hermes Signal data directory exists
  ansible.builtin.file:
    path: "{{ hermes_home }}/signal-data"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0775'

# Single profile-driven render loop. Every entry in `hermes_profiles` (including the
# `default` Robot profile) is deployed the same way; `target_dir` selects where
# (default -> hermes_home, sub-profiles -> hermes_home/profiles/<name>), and the template
# paths default to per-profile files under roles/hermes/{templates,files}/profiles/<name>/.
- name: Ensure Hermes subagent profile directories exist
  ansible.builtin.file:
    path: "{{ hermes_home }}/profiles/{{ item.name }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0700'
  loop: "{{ hermes_profiles }}"
  when: item.target_dir is not defined

- name: Deploy Hermes profile config.yaml
  ansible.builtin.template:
    src: "{{ item.config_template | default('config.yaml.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/config.yaml"
    owner: llm_wiki
    group: llm_wiki
    mode: '0640'
    force: true
  loop: "{{ hermes_profiles }}"

- name: Ensure Hermes profile SOUL.md files exist
  ansible.builtin.template:
    src: "{{ item.soul_template | default('profiles/' ~ item.name ~ '/SOUL.md.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/SOUL.md"
    owner: llm_wiki
    group: llm_wiki
    mode: '0660'
    force: true
  loop: "{{ hermes_profiles }}"

- name: Deploy Hermes profile env files
  ansible.builtin.template:
    src: "{{ item.env_template | default('env_default.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/.env"
    owner: llm_wiki
    group: llm_wiki
    mode: '0640'
  loop: "{{ hermes_profiles }}"

- name: Deploy Hermes Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ hermes_home }}/Dockerfile"
    owner: "{{ secrets.admin_username }}"
    group: llm_wiki
    mode: '0640'

- name: Deploy Hermes docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermes_home }}/docker-compose.yml"
    owner: "{{ secrets.admin_username }}"
    group: llm_wiki
    mode: '0640'

- name: Start Hermes container stack
  community.docker.docker_compose_v2:
    project_src: "{{ hermes_home }}"
    project_name: "hermes-agent"
    files:
      - docker-compose.yml
    state: present
    pull: missing
  ignore_errors: "{{ ansible_check_mode }}"

# Skill packs (epic 08): install obra/superpowers + mattpocock/skills via Hermes's own CLI
# so they are upgradeable and available on-demand to every profile. This replaces the old
# copy-vendored-skills method. Each entry in `hermes_skills` is installed only if not already
# registered (exact-match guard on the first column of `hermes skills list`), and the gateway
# is restarted so the new skills load. spec-kit is intentionally excluded (Hermes <=0.20.6 does
# not register `specify`-generated skills).
- name: Pause for Hermes gateway to become ready before installing skills
  ansible.builtin.pause:
    seconds: 20

- name: Install Hermes skill packs via Hermes CLI
  ansible.builtin.shell: >-
    docker exec hermes-agent hermes skills list |
    awk -F'│' '{n=$2; gsub(/^[ \t]+|[ \t]+$/, "", n); if (n=="{{ item.name }}") f=1} END{exit !f}' ||
    docker exec hermes-agent hermes skills install {{ item.source }} --force
  loop: "{{ hermes_skills | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _hermes_skill_install
  changed_when: "'Installed' in _hermes_skill_install.stdout"
  ignore_errors: true
  when: hermes_skills | default([]) | length > 0

- name: Restart Hermes gateway to load newly installed skills
  ansible.builtin.command: docker restart hermes-agent
  changed_when: true
  when:
    - hermes_skills | default([]) | length > 0
    - _hermes_skill_install is changed
