---
- name: Validate Hermes role prerequisites
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.admin_username is defined
      - secrets.admin_username | string | length > 0
      - secrets.hermes_default_openrouter_api_key | default('') | length > 0
      - hermes_signal_http_url | default('') | length > 0
      - secrets.hermes_signal_account | default('') | length > 0
      - secrets.hermes_signal_allowed_users | default('') | length > 0
    fail_msg: >-
      Hermes role requires Debian/Ubuntu hosts, admin_username, hermes_port,
      secrets.hermes_default_openrouter_api_key, hermes_signal_http_url, secrets.hermes_signal_account,
      and secrets.hermes_signal_allowed_users.

- name: Lookup llm_wiki passwd entry
  ansible.builtin.getent:
    database: passwd
    key: llm_wiki
  register: hermes_llm_user
  failed_when: false
  changed_when: false

- name: Assert llm_wiki user was resolved (created by the users role)
  ansible.builtin.assert:
    that:
      - hermes_llm_user.ansible_facts is defined
      - hermes_llm_user.ansible_facts.getent_passwd.llm_wiki is defined
    fail_msg: >-
      The llm_wiki user was not found; it must be created by the users role before
      the hermes role runs.

- name: Set host_uid and host_gid facts from llm_wiki
  ansible.builtin.set_fact:
    hermes_host_uid: "{{ hermes_llm_user.ansible_facts.getent_passwd.llm_wiki[1] }}"
    hermes_host_gid: "{{ hermes_llm_user.ansible_facts.getent_passwd.llm_wiki[2] }}"

- name: Ensure persistent Hermes data root exists for admin user
  ansible.builtin.file:
    path: "{{ hermes_home }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0700'
    recurse: true

- name: Ensure Hermes Signal data directory exists
  ansible.builtin.file:
    path: "{{ hermes_home }}/signal-data"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0775'

# Single profile-driven render loop. Every entry in `hermes_profiles` (including the
# `default` Jack-O-Rama profile) is deployed the same way; `target_dir` selects where
# (default -> hermes_home, sub-profiles -> hermes_home/profiles/<name>), and the template
# paths default to per-profile files under roles/hermes/{templates,files}/profiles/<name>/.
- name: Ensure Hermes subagent profile directories exist
  ansible.builtin.file:
    path: "{{ hermes_home }}/profiles/{{ item.name }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0700'
  loop: "{{ hermes_profiles }}"
  when: item.target_dir is not defined

- name: Deploy Hermes profile config.yaml
  ansible.builtin.template:
    src: "{{ item.config_template | default('config.yaml.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/config.yaml"
    owner: llm_wiki
    group: llm_wiki
    mode: '0640'
    force: true
  loop: "{{ hermes_profiles }}"

- name: Ensure Hermes profile SOUL.md files exist
  ansible.builtin.template:
    src: "{{ item.soul_template | default('profiles/' ~ item.name ~ '/SOUL.md.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/SOUL.md"
    owner: llm_wiki
    group: llm_wiki
    mode: '0660'
    force: false
  loop: "{{ hermes_profiles }}"

- name: Deploy Hermes profile env files
  ansible.builtin.template:
    src: "{{ item.env_template | default('env_profile.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/.env"
    owner: llm_wiki
    group: llm_wiki
    mode: '0640'
  loop: "{{ hermes_profiles }}"

- name: Deploy Hermes profile skill files
  ansible.builtin.copy:
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/skills/"
    src: "{{ item.skills_src }}"
    owner: llm_wiki
    group: llm_wiki
    mode: '0644'
  loop: "{{ hermes_profiles }}"
  when: item.skills_src is defined

- name: Ensure hermes project home ownership for llm_wiki
  ansible.builtin.file:
    path: "{{ silverbullet_data_dir }}"
    state: directory
    owner: llm_wiki
    group: llm_wiki
    mode: '0775'

- name: Deploy Hermes Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ hermes_home }}/Dockerfile"
    owner: "{{ secrets.admin_username }}"
    group: llm_wiki
    mode: '0640'

- name: Deploy Hermes docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermes_home }}/docker-compose.yml"
    owner: "{{ secrets.admin_username }}"
    group: llm_wiki
    mode: '0640'

- name: Start Hermes container stack
  community.docker.docker_compose_v2:
    project_src: "{{ hermes_home }}"
    project_name: "hermes-agent"
    files:
      - docker-compose.yml
    state: present
    pull: missing
  ignore_errors: "{{ ansible_check_mode }}"
