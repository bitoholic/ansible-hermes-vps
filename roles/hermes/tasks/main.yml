---
- name: Validate Hermes role prerequisites
  tags: [hermes]
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - secrets.admin_username is defined
      - secrets.admin_username | string | length > 0
      - secrets.hermes_default_openrouter_api_key | default('') | length > 0
      - hermes_signal_http_url | default('') | length > 0
      - secrets.hermes_signal_account | default('') | length > 0
      - secrets.hermes_signal_allowed_users | default('') | length > 0
      - secrets.matrix_bot_password | default('') | length > 0
      - secrets.matrix_allowed_users | default('') | length > 0
    fail_msg: >-
      Hermes role requires Debian/Ubuntu hosts, admin_username, hermes_port,
      secrets.hermes_default_openrouter_api_key, hermes_signal_http_url, secrets.hermes_signal_account,
      secrets.hermes_signal_allowed_users, secrets.matrix_bot_password, and secrets.matrix_allowed_users.

- name: Ensure persistent Hermes data root exists for admin user
  tags: [hermes]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ hermes_home }}"
    wiki_volume_directory_mode: '0700'
    wiki_volume_directory_recurse: true

- name: Ensure Hermes Signal data directory exists
  tags: [hermes]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ hermes_home }}/signal-data"
    wiki_volume_directory_mode: '0775'

# Single profile-driven render loop. Every entry in `hermes_profiles` (including the
# `default` Robot profile) is deployed the same way; `target_dir` selects where
# (default -> hermes_home, sub-profiles -> hermes_home/profiles/<name>), and the template
# paths default to per-profile files under roles/hermes/{templates,files}/profiles/<name>/.
- name: Ensure Hermes subagent profile directories exist
  tags: [hermes]
  ansible.builtin.include_role:
    name: wiki_volume
    tasks_from: ensure_directory
  vars:
    wiki_volume_directory_path: "{{ hermes_home }}/profiles/{{ item.name }}"
    wiki_volume_directory_mode: '0700'
  loop: "{{ hermes_profiles }}"
  when: item.target_dir is not defined

- name: Deploy Hermes profile config.yaml
  tags: [hermes]
  ansible.builtin.template:
    src: "{{ item.config_template | default('config.yaml.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/config.yaml"
    owner: llm_wiki
    group: llm_wiki
    mode: '0640'
    force: true
  loop: "{{ hermes_profiles }}"

- name: Ensure Hermes profile SOUL.md files exist
  tags: [hermes]
  ansible.builtin.template:
    src: "{{ item.soul_template | default('profiles/' ~ item.name ~ '/SOUL.md.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/SOUL.md"
    owner: llm_wiki
    group: llm_wiki
    mode: '0660'
    force: true
  loop: "{{ hermes_profiles }}"

- name: Deploy Hermes profile env files
  tags: [hermes]
  ansible.builtin.template:
    src: "{{ item.env_template | default('env_default.j2') }}"
    dest: "{{ item.target_dir | default(hermes_home ~ '/profiles/' ~ item.name) }}/.env"
    owner: llm_wiki
    group: llm_wiki
    mode: '0640'
  loop: "{{ hermes_profiles }}"

- name: Copy Hermes Dockerfile to hermes home
  tags: [hermes]
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ hermes_home }}/Dockerfile"
    owner: "{{ secrets.admin_username }}"
    group: llm_wiki
    mode: '0640'

# Skill-pack installation moved to tasks/provision.yml (epic 16, #01) — it needs the
# hermes-agent container actually running (docker exec), which now happens later in
# the play (docker's compose-stack start is relocated to the end of the play). No
# longer runs automatically as part of this role's default sequence; invoked
# explicitly from site.yml's end-of-play tasks, after the compose stack starts.
