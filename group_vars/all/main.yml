---
ansible_python_interpreter: /usr/bin/python3

# Non-secret deployment configuration. Secret values are NOT defined here: they are
# resolved by the `secrets` role from the single manifest in group_vars/all/secrets.yml
# and consumed by roles as `secrets.*`.

# Reverse proxy and web domains / paths (non-secret)
silverbullet_bind: "[IP_ADDRESS]:3000"
silverbullet_data_dir: /opt/hermes/wiki
silverbullet_compose_dir: /opt/silverbullet
silverbullet_image: ghcr.io/silverbulletmd/silverbullet:latest

# Authelia paths (non-secret)
authelia_config_dir: /opt/authelia
authelia_data_dir: /opt/authelia-data

# Hermes agent (non-secret constants)
hermes_user: hermes
hermes_home: /opt/hermes
hermes_signal_http_url: "http://signal-cli:8080"

# Conduit personal Matrix homeserver (epic 06 #01): private, non-federated, reached only
# over the internal Docker network / Tailscale. No public Matrix port is published.
conduit_compose_dir: /opt/conduit
conduit_data_dir: /opt/conduit/data
conduit_image: matrixconduit/matrix-conduit:v0.10.13
conduit_port: 8008
conduit_server_name: "{{ inventory_hostname }}"
# URL Hermes uses to reach the Conduit homeserver from inside the shared Docker
# network (epic 06 #03: Matrix transport, default profile only).
conduit_internal_url: "http://conduit:{{ conduit_port }}"
# E2EE posture for the Hermes Matrix bot. "required" fails closed if crypto deps
# are missing; switch to "optional" if the agent image lacks mautrix[encryption].
conduit_e2ee_mode: "required"

# Tailscale private-access overlay (epic 07). The host firewall (tailscale role) and the
# gateway Caddy MFA bypass (epic 07 #02) both reference these, so a subnet/interface change
# is a single edit (user story #12).
tailscale_interface: tailscale0
tailscale_subnet: "100.64.0.0/10"

# The single Hermes agent, expressed as a data entry and consumed by the render loop in
# the hermes role. The `default` entry is the main "second brain" agent, deployed to
# hermes_home directly. (Sub-profiles were removed in epic 09; the loop still supports
# them should one ever be needed again.)
# `target_dir` overrides the deploy location; `config_template`/`soul_template`/`env_template`/
# default to per-profile files under roles/hermes/{templates,files}/profiles/<name>/. Skill packs
# (superpowers + mattpocock) are no longer vendored here; they are installed at runtime via the
# Hermes CLI from `hermes_skills` (see group_vars/all/hermes_skills.yml).
# The shared `config.yaml.j2`/`env_default.j2` templates are parameterized by the per-profile
# fields below (model_*, enable_base_features, enable_web/browser, mcp_servers, tools_disabled,
# skills_auto_load, dashboard, onboarding_seen) — see epic 02 tickets #02/#03. Per-profile
# secrets are NOT stored here; the templates read them from the resolver's
# `secrets.profiles.<name>.*` (default profile secrets use `secrets.hermes_default_*`), so the
# single-seam contract holds: only the `secrets` resolver reads credentials from the environment.
hermes_profiles:
  - name: default
    target_dir: "{{ hermes_home }}"
    config_template: config.yaml.j2
    soul_template: SOUL.md.j2
    env_template: env_default.j2
    is_default: true
    model_provider: openrouter
    model_default: openrouter/free
    terminal_cwd: /opt/data/wiki
    enable_base_features: true
    enable_web: true
    enable_browser: true
    dashboard: true
    skills_auto_load:
      - research/llm-wiki
    onboarding_seen: busy_input_prompt
    mcp_servers:
      - name: context7
        pkg: "@upstash/context7-mcp"
      - name: github
        pkg: "@modelcontextprotocol/server-github"
      - name: playwright
        pkg: "@modelcontextprotocol/server-playwright"

# Backup and sync (non-secret)
backup_working_branch: vps-sync
backup_commit_message: 'chore: sync wiki'

# Security defaults (non-secret)
common_ssh_port: 22
common_ufw_default_incoming_policy: deny
common_ufw_default_outgoing_policy: allow
common_unattended_upgrades_enabled: true

# Dedicated application system user is llm_wiki
