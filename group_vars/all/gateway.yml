---
# Gateway / reverse-proxy seam (epic 03, #01 / #02).
# `gateway_routes` is the single source of truth for the published ingress surface. It is
# ASSEMBLED from each role's own `gateway_publish` contribution (see roles/*/defaults/main.yml),
# so publishing a new service is a one-line entry in that service's role — SilverBullet no
# longer encodes knowledge of Hermes or Authelia. The gateway role is the only writer of the
# Caddyfile; it loads these contributions (via include_vars) before rendering.
gateway_routes: "{{ silverbullet_gateway_publish + hermes_gateway_publish + authelia_gateway_publish + conduit_gateway_publish + owntracks_gateway_publish }}"
