---
# Hermes skill packs installed via Hermes's own CLI (upgradeable, on-demand for all
# profiles) instead of the old copy-vendored-skills method. Consumed by a single loop in
# roles/hermes/tasks/main.yml that runs `hermes skills install <source> --force` for each
# entry, skipping any already registered (exact-match guard).
#
# Spike result (Hermes v0.20.6): `hermes skills install <source> --force` is the only
# reliable path. `hermes plugins install` is blocked by the 0.20.6 security scanner, and
# `specify`-generated spec-kit skills are not registered by Hermes, so spec-kit is excluded.
#
# superpowers: per-skill raw GitHub URLs (newest `main`).
# mattpocock/skills: per-skill skills.sh sources (auto-resolves latest).
