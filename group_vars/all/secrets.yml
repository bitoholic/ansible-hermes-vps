---
secrets_manifest:
  authelia_admin_email:
    env: AUTHELIA_ADMIN_EMAIL
    required: false
    default: "admin@example.com"
  authelia_admin_username:
    env: AUTHELIA_ADMIN_USERNAME
    required: false
    default: "admin"
  authelia_admin_password_hash:
    env: AUTHELIA_ADMIN_PASSWORD_HASH
    required: true
  authelia_session_secret:
    env: AUTHELIA_SESSION_SECRET
    required: true
  authelia_storage_key:
    env: AUTHELIA_STORAGE_KEY
    required: true
  silverbullet_admin_username:
    env: SILVERBULLET_ADMIN_USERNAME
    required: false
    default: "admin"
  silverbullet_admin_password:
    env: SILVERBULLET_ADMIN_PASSWORD
    required: false
    default: "P4ssw04d"
  silverbullet_domain:
    env: SILVERBULLET_DOMAIN
    required: false
    default: "wiki.example.com"
  hermes_signal_account:
    env: SIGNAL_ACCOUNT
    required: true
  hermes_signal_allowed_users:
    env: SIGNAL_ALLOWED_USERS
    required: true
  conduit_registration_secret:
    env: CONDUIT_REGISTRATION_SECRET
    required: true
  matrix_bot_password:
    env: MATRIX_BOT_PASSWORD
    required: true
  matrix_allowed_users:
    env: MATRIX_ALLOWED_USERS
    required: true
  matrix_allowed_rooms:
    env: MATRIX_ALLOWED_ROOMS
    required: false
    default: ""
  tailscale_authkey:
    env: TAILSCALE_AUTHKEY
    required: true
  hermes_default_openrouter_api_key:
    env: OPENROUTER_API_KEY
    required: true
  hermes_default_nous_portal_api_key:
    env: NOUS_PORTAL_API_KEY
    required: true
  # Intentionally shares GITHUB_TOKEN with backup_github_token below.
  hermes_default_github_token:
    env: GITHUB_TOKEN
    required: true
  hermes_default_resend_api_key:
    env: RESEND_API_KEY
    required: false
  hermes_default_context7_api_key:
    env: CONTEXT7_API_KEY
    required: false
  hermes_default_dashboard_admin_password_hash:
    env: DASHBOARD_ADMIN_PASSWORD_HASH
    required: true
  github_repo_slug:
    env: GITHUB_REPO_SLUG
    required: false
    default: "example/llm-wiki"
  # Intentionally shares GITHUB_TOKEN with hermes_default_github_token above.
  backup_github_token:
    env: GITHUB_TOKEN
    required: true
  admin_username:
    env: ADMIN_USERNAME
    required: false
    default: "admin"
  admin_ssh_public_key:
    env: ADMIN_SSH_PUBLIC_KEY
    required: true
  # Git identity consumed by the hermes/backup .env content (resolved via lookup('env') today).
  git_username:
    env: GIT_USERNAME
    required: false
  git_email:
    env: GIT_EMAIL
    required: false

  # Default profile context7 key, exposed as secrets.profiles.default.context7_api_key so
  # config.yaml.j2 reads it uniformly via secrets.profiles[item.name].context7_api_key.
  default_context7_api_key:
    env: CONTEXT7_API_KEY
    profile: default
    required: false

  # OwnTracks recorder basic auth (epic 12, #02/#05)
  owntracks_admin_username:
    env: OWNTRACKS_ADMIN_USERNAME
    required: false
    default: "admin"
  owntracks_admin_password:
    env: OWNTRACKS_ADMIN_PASSWORD
    required: true

  # Caddy ACME certificate issuance contact (epic 12, #05). The ticket's
  # default ("admin@{{ secrets.silverbullet_domain }}") is unresolvable: the
  # manifest is templated before the resolver loop populates `secrets`
  # (StrictUndefined). Derive from the same env the resolver uses instead.
  acme_email:
    env: ACME_EMAIL
    required: false
    default: "admin@{{ lookup('ansible.builtin.env', 'SILVERBULLET_DOMAIN') | default('wiki.example.com', true) }}"

  # Syncplay server password (epic 12, #06)
  syncplay_password:
    env: SYNCPLAY_PASSWORD
    required: true

  # Beszel agent<->hub pairing (epic 18, #03). The hub generates this key/token
  # pair itself, surfaced through its web UI when the operator adds the local
  # VPS as a "system" there — it cannot be pre-seeded like every other secret
  # in this manifest.
  #
  # required: false, deliberately NOT true (caught in review): the analogy to
  # TAILSCALE_AUTHKEY only holds up to a point. TAILSCALE_AUTHKEY is obtainable
  # from Tailscale's console with zero dependency on this playbook ever having
  # run. These two can only be obtained AFTER the hub has already been deployed
  # BY this playbook — and roles/secrets/tasks/main.yml's fail-fast check is a
  # blanket assert over the whole manifest, unconditional on --skip-tags and
  # run before any other role's tasks. Marking these required: true would brick
  # every future deploy of the entire VPS (not just Beszel) the moment this
  # ticket merged, since the real values can never exist before a first deploy
  # already succeeded. Left unset, the agent container just gets empty
  # TOKEN/KEY values and fails to authenticate — a self-contained failure of
  # the one new service, not a block on everything else, until the operator
  # completes the one-time pairing step and redeploys.
  beszel_agent_key:
    env: BESZEL_AGENT_KEY
    required: false
  beszel_agent_token:
    env: BESZEL_AGENT_TOKEN
    required: false

  # AdGuard Home admin account (epic 18, #04) — same shape as
  # authelia_admin_username/authelia_admin_password_hash: the operator
  # precomputes the bcrypt hash themselves (e.g. via htpasswd -B -C 10 -n -b)
  # and provides it directly. Unlike Beszel's pairing credential, this has no
  # chicken-and-egg problem — the hash doesn't depend on this playbook or
  # AdGuard ever having run, so required: true is safe here.
  adguard_admin_username:
    env: ADGUARD_ADMIN_USERNAME
    required: false
    default: "admin"
  adguard_admin_password_hash:
    env: ADGUARD_ADMIN_PASSWORD_HASH
    required: true

  # Cloudflare API token (epic 19, #02): authenticates Caddy's DNS-01 ACME
  # challenge for the matrix/owntracks routes (roles/gateway/templates/
  # Caddyfile.j2), so certificate issuance keeps working once their DNS
  # records are Cloudflare-proxied (HTTP-01/TLS-ALPN-01 would permanently
  # break at that point — see ADR-0003 and the epic 19 spec). Scope this to
  # the minimum privilege needed: a token with Zone:DNS:Edit on the operator's
  # one zone only, not a global/account-wide token. No default — obtainable
  # only from the operator's own Cloudflare dashboard, same category as
  # TAILSCALE_AUTHKEY.
  cloudflare_api_token:
    env: CLOUDFLARE_API_TOKEN
    required: true

  # Windscribe WireGuard credential set (epic 23): one configuration generated in Windscribe for the
  # VPS alone (never a workstation's own config — see the epic 23 spec's "Further Notes"), shared by
  # every exit location (the spike verified one key connects to several servers, even two at once).
  # private_key/preshared_key are the tunnel's WireGuard keys; address is the tunnel-internal IPv4
  # gluetun's Windscribe provider binds to.
  exit_node_windscribe_private_key:
    env: WINDSCRIBE_PRIVATE_KEY
    required: true
  exit_node_windscribe_address:
    env: WINDSCRIBE_ADDRESS
    required: true
  exit_node_windscribe_preshared_key:
    env: WINDSCRIBE_PRESHARED_KEY
    required: true

  # Exit-node Tailscale auth key (epic 23): reusable and tagged so an ACL auto-approver can approve
  # exit-node advertisement without a manual click per location. Deliberately its own secret, distinct
  # from TAILSCALE_AUTHKEY (the VPS's own node) — a compromised exit-node container must never carry
  # the VPS's own tailnet identity. Auth keys expire (90 days at most; an already-registered node keeps
  # working) — see the epic 23 docs for re-minting before adding a location after expiry.
  exit_node_tailscale_authkey:
    env: EXIT_NODE_TAILSCALE_AUTHKEY
    required: true
