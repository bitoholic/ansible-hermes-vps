---
- name: Bootstrap admin user and lock down SSH
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate that protected roles are not skipped via --skip-tags
      ansible.builtin.assert:
        that:
          - "'secrets' not in (ansible_skip_tags | default([]))"
          - "'users' not in (ansible_skip_tags | default([]))"
          - "'ssh_hardening' not in (ansible_skip_tags | default([]))"
          - "'common' not in (ansible_skip_tags | default([]))"
        fail_msg: >-
          Cannot skip protected role(s). These are mandatory for system bootstrap and safety.
          Protected roles: secrets, users, ssh_hardening, common.
  roles:
    - role: secrets
  tasks:
    - name: Assert top-level deployment prerequisites
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
          - secrets.admin_username is defined
          - secrets.admin_username | string | length > 0
          - secrets.admin_ssh_public_key is defined
          - secrets.admin_ssh_public_key | string | length > 0
        fail_msg: "This deployment only supports Debian/Ubuntu hosts and requires admin_username and admin_ssh_public_key."

    - name: Create bootstrap admin user
      ansible.builtin.user:
        name: "{{ secrets.admin_username }}"
        shell: /bin/bash
        groups:
          - sudo
          - adm
        append: true
        create_home: true
        state: present

    - name: Ensure admin SSH directory exists
      ansible.builtin.file:
        path: "/home/{{ secrets.admin_username }}/.ssh"
        state: directory
        owner: "{{ secrets.admin_username }}"
        group: "{{ secrets.admin_username }}"
        mode: '0700'

    - name: Authorize provided admin SSH public key
      ansible.posix.authorized_key:
        user: "{{ secrets.admin_username }}"
        state: present
        key: "{{ secrets.admin_ssh_public_key }}"

    - name: Ensure passwordless sudo is enabled for admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ secrets.admin_username }}"
        content: "{{ secrets.admin_username }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: '0440'

    - name: Validate admin sudoers file syntax
      ansible.builtin.command:
        cmd: "visudo -cf /etc/sudoers.d/{{ secrets.admin_username }}"
      register: sudoers_validation
      changed_when: false
      failed_when: sudoers_validation.rc != 0

- name: Provision server as the configured admin user
  hosts: all
  gather_facts: true
  vars:
    ansible_user: "{{ secrets.admin_username }}"
  become: true
  tasks:
    - name: Assert provisioning user and platform expectations
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
          - secrets.admin_username is defined
          - secrets.admin_username | string | length > 0
          - ansible_user == secrets.admin_username
        fail_msg: "Play 2 must run as {{ secrets.admin_username }} on Debian/Ubuntu hosts."

    # Epic 16, #01: docker's compose-stack start, and the provisioning tasks that
    # need it already running, execute here — Ansible always runs a play's `tasks:`
    # after its `roles:`, regardless of where each is positioned in this file, so
    # listing these here (textually before `roles:`) still means they run after
    # every role below that deploys a bind-mounted config file (conduit, hermes,
    # authelia, gateway). This intentionally runs after `backup` too (inert — backup
    # has no docker/container interaction) rather than threaded in at a specific
    # mid-list point.
    #
    # docker's start step uses import_role/tasks_from (not a bare include_tasks) so
    # docker's own meta/main.yml dependencies still fire for it, the same as any
    # other role invocation — matters if a future ticket adds docker -> gateway
    # there. conduit's and hermes's provision steps use a bare include_tasks
    # instead: import_role/tasks_from was tried first and re-triggered conduit's/
    # hermes's meta dependency on docker, re-running docker's ENTIRE role (apt
    # installs, network setup, compose render) a second time right here — found via
    # `--list-tasks` while implementing this. Neither provision file needs its
    # role's meta dependencies to fire (both only need facts/state already
    # established during the config phase, earlier in this same play), so a bare
    # include_tasks is correct here, not just expedient.
    - name: Start consolidated docker compose stack
      ansible.builtin.import_role:
        name: docker
        tasks_from: start
      tags: [docker]

    - name: Conduit bot provisioning
      ansible.builtin.include_tasks: roles/conduit/tasks/provision.yml
      tags: [conduit]

    - name: Hermes skill-pack provisioning
      ansible.builtin.include_tasks: roles/hermes/tasks/provision.yml
      tags: [hermes]

  roles:
    - role: secrets
      tags:
        - secrets
    - role: users
      tags:
        - users
    - role: ssh_hardening
      tags:
        - ssh_hardening
    - role: common
      tags:
        - common
    - role: tailscale
      tags:
        - tailscale
    # owntracks is not listed here as its own entry (epic 15, #01): gateway's
    # meta/main.yml declares it as a real dependency, which Ansible does NOT
    # deduplicate against an explicit sibling roles: entry for the same role (only
    # against another role's dependency on it) — listing both here would run
    # owntracks (and its wiki_volume/users chain) twice per playbook run, verified
    # empirically via `ansible-playbook site.yml --list-tasks`. The dependency alone
    # preserves today's effective order (owntracks immediately before gateway,
    # still before docker) and keeps --skip-tags owntracks working (the dependency
    # carries its own tags: [owntracks]).
    - role: gateway
      tags:
        - gateway
    # docker is not listed here as its own entry (epic 17, #02): every role below
    # that needs it (conduit, hermes, authelia, silverbullet) already declares it
    # as a meta/main.yml dependency, which places it here anyway — right where
    # this explicit entry used to sit, since conduit was already the next role
    # listed. Keeping both an explicit entry and dependencies on the same role
    # duplicates its execution (the same finding that already removed owntracks's
    # explicit entry above); see tests/check-role-duplication.sh.
    - role: conduit
      tags:
        - conduit
    - role: hermes
      tags:
        - hermes
    - role: authelia
      tags:
        - authelia
    - role: silverbullet
      tags:
        - silverbullet
    - role: backup
      tags:
        - backup
