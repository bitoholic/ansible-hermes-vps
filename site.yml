---
- name: Bootstrap admin user and lock down SSH
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate that protected roles are not skipped via --skip-tags
      ansible.builtin.assert:
        that:
          - "'secrets' not in (ansible_skip_tags | default([]))"
          - "'users' not in (ansible_skip_tags | default([]))"
          - "'ssh_hardening' not in (ansible_skip_tags | default([]))"
          - "'common' not in (ansible_skip_tags | default([]))"
        fail_msg: >-
          Cannot skip protected role(s). These are mandatory for system bootstrap and safety.
          Protected roles: secrets, users, ssh_hardening, common.
  roles:
    - role: secrets
  tasks:
    - name: Assert top-level deployment prerequisites
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
          - secrets.admin_username is defined
          - secrets.admin_username | string | length > 0
          - secrets.admin_ssh_public_key is defined
          - secrets.admin_ssh_public_key | string | length > 0
        fail_msg: "This deployment only supports Debian/Ubuntu hosts and requires admin_username and admin_ssh_public_key."

    - name: Create bootstrap admin user
      ansible.builtin.user:
        name: "{{ secrets.admin_username }}"
        shell: /bin/bash
        groups:
          - sudo
          - adm
        append: true
        create_home: true
        state: present

    - name: Ensure admin SSH directory exists
      ansible.builtin.file:
        path: "/home/{{ secrets.admin_username }}/.ssh"
        state: directory
        owner: "{{ secrets.admin_username }}"
        group: "{{ secrets.admin_username }}"
        mode: '0700'

    - name: Authorize provided admin SSH public key
      ansible.posix.authorized_key:
        user: "{{ secrets.admin_username }}"
        state: present
        key: "{{ secrets.admin_ssh_public_key }}"

    - name: Ensure passwordless sudo is enabled for admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ secrets.admin_username }}"
        content: "{{ secrets.admin_username }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: '0440'

    - name: Validate admin sudoers file syntax
      ansible.builtin.command:
        cmd: "visudo -cf /etc/sudoers.d/{{ secrets.admin_username }}"
      register: sudoers_validation
      changed_when: false
      failed_when: sudoers_validation.rc != 0

- name: Provision server as the configured admin user
  hosts: all
  gather_facts: true
  vars:
    ansible_user: "{{ secrets.admin_username }}"
  become: true
  tasks:
    - name: Assert provisioning user and platform expectations
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
          - secrets.admin_username is defined
          - secrets.admin_username | string | length > 0
          - ansible_user == secrets.admin_username
        fail_msg: "Play 2 must run as {{ secrets.admin_username }} on Debian/Ubuntu hosts."

  roles:
    - role: secrets
      tags:
        - secrets
    - role: users
      tags:
        - users
    - role: ssh_hardening
      tags:
        - ssh_hardening
    - role: common
      tags:
        - common
    - role: tailscale
      tags:
        - tailscale
    - role: gateway
      tags:
        - gateway
    - role: docker
      tags:
        - docker
    - role: conduit
      tags:
        - conduit
    - role: hermes
      tags:
        - hermes
    - role: authelia
      tags:
        - authelia
    - role: silverbullet
      tags:
        - silverbullet
    - role: backup
      tags:
        - backup
