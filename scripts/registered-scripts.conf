# The one allowlist of operator scripts that `scripts/deploy --script NAME` may run, with the decrypted
# environment and redacted output. Format: `name  repo-relative-path`. Each script must live in this
# repository; anything not listed here is refused.
#
# verify-live arrives with epic 21 (until that lands the entry is refused as "not present in this checkout").
# Other epics add their entries when their scripts exist (epic 24's public-readiness audit).
verify-live          scripts/verify-live.sh
verify-exit-nodes    scripts/verify-exit-nodes.sh
