# The one allowlist of operator scripts that `scripts/deploy --script NAME` may run, with the decrypted
# environment and redacted output. Format: `name  repo-relative-path`. Each script must live in this
# repository; anything not listed here is refused.
#
# verify-live arrives with epic 21 (until that lands the entry is refused as "not present in this checkout").
verify-live          scripts/verify-live.sh
verify-exit-nodes    scripts/verify-exit-nodes.sh
# Public-readiness audit (epic 24 ticket #01): derives its denylist from the decrypted secret set,
# so it must run through script mode, not standalone, to see it. The generic (no-secret) rules alone
# are also runnable directly: python3 scripts/public-readiness-audit.py --generic-only
audit                scripts/public-readiness-audit.py
# Public export, history-preserving (epic 24 ticket #04): builds its scrub rules from the decrypted
# secret set the same way `audit` builds its denylist, so it also needs script mode to see it.
export-public        scripts/export-public.py
