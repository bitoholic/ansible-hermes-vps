---
- name: Local dry-run validation playbook
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    authelia_config_dir: /etc/authelia
    authelia_data_dir: /var/lib/authelia
    admin_username: admin
    admin_ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQCtestkey"
    hermes_port: 8642
    hermes_signal_http_url: "http://signal-cli-api:8080"
    # hermes_profiles inherits the single `default` entry from group_vars/all/main.yml.
    silverbullet_domain: wiki.example.com
    silverbullet_data_dir: /opt/wiki
    silverbullet_compose_dir: /opt/silverbullet
    backup_working_branch: vps-sync
    # A play var (not a role default) so it overrides a real gathered fact too, if one exists: the caddy compose
    # fragment binds to it, and a container control host may have no "default route" interface for facts to find.
    ansible_default_ipv4:
      address: 127.0.0.1
  tasks:
    # Stub the resolved secrets dict so the roles can be dry-run locally.
    # In real runs the `secrets` role resolves these from environment variables
    # (sourced from .env) and enforces required values.
    - name: Stub resolved secrets for local dry-run
      no_log: true   # this task's OWN result would otherwise print the whole stub dict at high verbosity
      ansible.builtin.set_fact:
        secrets:
          authelia_admin_email: admin@example.com
          authelia_admin_username: admin
          authelia_admin_password_hash: "$argon2id$v=19$m=65536,t=3,p=4$LEAKCANARYAUTHELIAHASHxxxxxxxxxxxxxxxxxxxxxxxxxx"
          authelia_session_secret: "LEAK-CANARY-AUTHELIA-SESSION-0123456789abcdef0123456789abcdef"
          authelia_storage_key: "LEAK-CANARY-AUTHELIA-STORAGE-0123456789abcdef0123456789abcdef"
          silverbullet_admin_username: admin
          silverbullet_admin_password: LEAK-CANARY-SILVERBULLET-PW
          silverbullet_domain: wiki.example.com
          hermes_signal_account: signal@example.com
          hermes_signal_allowed_users: "user1,user2"
          hermes_default_openrouter_api_key: LEAK-CANARY-OPENROUTER-KEY
          hermes_default_nous_portal_api_key: LEAK-CANARY-NOUS-KEY
          hermes_default_github_token: LEAK-CANARY-GITHUB-TOKEN
          hermes_default_resend_api_key: LEAK-CANARY-RESEND-KEY
          hermes_default_context7_api_key: LEAK-CANARY-CONTEXT7-KEY
          hermes_default_dashboard_admin_password_hash: LEAK-CANARY-DASHBOARD-HASH
          github_repo_slug: example/llm-wiki
          backup_github_token: LEAK-CANARY-BACKUP-TOKEN
          admin_username: admin
          admin_ssh_public_key: "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQCtestkey"
          # git_username/git_email deliberately left unset: both tasks that use them are gated on
          # `length > 0` and become_user the admin OS user, which this dry run's bare control host never
          # creates (no `users` role step here) — leaving them unset skips those two tasks cleanly rather
          # than failing on an unrelated, pre-existing fixture gap.
          owntracks_admin_username: otradmin
          owntracks_admin_password: LEAK-CANARY-OWNTRACKS-PW
          conduit_registration_secret: LEAK-CANARY-CONDUIT-REG
          matrix_bot_password: LEAK-CANARY-MATRIX-PW
          matrix_allowed_users: "@user1:example.com"
          acme_email: admin@example.com
          syncplay_password: LEAK-CANARY-SYNCPLAY-PW
          beszel_agent_key: LEAK-CANARY-BESZEL-KEY
          beszel_agent_token: LEAK-CANARY-BESZEL-TOKEN
          adguard_admin_username: dnsadmin
          adguard_admin_password_hash: "$2y$05$LEAKCANARYADGUARDHASHxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          cloudflare_api_token: LEAK-CANARY-CLOUDFLARE-TOKEN
          profiles:
            default:
              context7_api_key: LEAK-CANARY-PROFILE-CONTEXT7-KEY

    - name: Preview common role tasks
      ansible.builtin.include_role:
        name: common

    - name: Preview docker role tasks
      ansible.builtin.include_role:
        name: docker

    - name: Preview authelia role tasks
      ansible.builtin.include_role:
        name: authelia

    - name: Preview silverbullet role tasks
      ansible.builtin.include_role:
        name: silverbullet

    - name: Preview hermes role tasks
      ansible.builtin.include_role:
        name: hermes

    - name: Preview backup role tasks
      ansible.builtin.include_role:
        name: backup

    # owntracks/adguard/conduit/gateway are NOT previewed here: owntracks's own htpasswd generation doesn't declare
    # check-mode support (Ansible skips its real file write under --check, so the immediately following task, which
    # reads that file back for real, would fail for a reason unrelated to suppression), and gateway depends on the
    # fact that step sets. All four are still covered: structurally by tests/check-secret-suppression.sh (which
    # needs no host, module or check-mode behavior at all), and by manual review recorded in the epic 22 #05 ticket
    # notes for the specific tasks this ticket touched in each of them.
