---
- hosts: localhost
  connection: local
  gather_facts: false
  # Stub secrets so the shared template resolves; in a real run these come from the resolver.
  vars:
    secrets:
      hermes_default_context7_api_key: stub-c7
      hermes_default_github_token: stub-gh
      hermes_default_dashboard_admin_password_hash: stub-ph
      profiles:
        default:
          context7_api_key: stub-c7-default
  pre_tasks:
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/main.yml"
  tasks:
    - name: Render shared config.yaml.j2 per profile
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/hermes/templates/config.yaml.j2"
        dest: "/tmp/hermes_cfg_{{ item.name }}.yaml"
      loop: "{{ hermes_profiles }}"

    - name: Assert per-profile structural invariants
      ansible.builtin.assert:
        that:
          - cfg is defined
          - (item.name == 'default') == ('dashboard' in cfg)
          - (item.name == 'default') == (cfg.get('skills', {}).get('auto_load') == ['research/llm-wiki'])
          - "'dashboard' in cfg"
          - "cfg.mcp_servers | length == 3"
          - "'context7' in cfg.mcp_servers and 'github' in cfg.mcp_servers and 'playwright' in cfg.mcp_servers"
          - "cfg.mcp_servers.context7.env.CONTEXT7_API_KEY | length > 0"
        fail_msg: "config.yaml mismatch for profile {{ item.name }}: {{ cfg }}"
      loop: "{{ hermes_profiles }}"
      vars:
        cfg: "{{ lookup('file', '/tmp/hermes_cfg_' ~ item.name ~ '.yaml') | from_yaml }}"
      loop_control:
        label: "{{ item.name }}"
