---
# Consolidated docker-compose.yml render test (epic 11 ticket #06).
# Validates that the docker role's docker-compose.yml.j2 template renders all enabled
# services correctly and passes `docker compose config`.
- name: Docker compose render invariants
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    docker_compose_dir: /tmp/docker_compose_test
    docker_project_name: test-hermes-vps
    docker_enabled_services:
      - caddy
      - caddy-relay
      - authelia
      - silverbullet
      - conduit
      - signal-cli
      - hermes-agent
      - owntracks
      - owntracks-frontend
      - beszel-hub
      - beszel-agent
      - adguard
      - syncplay
    docker_networks:
      - name: gateway
        driver: bridge
      - name: internal
        driver: bridge
    docker_volumes:
      - caddy_data
      - caddy_config
      - syncplay_data
    owntracks_data_dir: "{{ docker_compose_dir }}/owntracks/store"
    silverbullet_compose_dir: /opt/silverbullet
    silverbullet_data_dir: /opt/hermes/wiki
    silverbullet_image: ghcr.io/silverbulletmd/silverbullet:latest
    wiki_volume_uid: 1000
    wiki_volume_gid: 1000
    docker_bind_address: "0.0.0.0"
    authelia_config_dir: /opt/authelia
    authelia_data_dir: /opt/authelia-data
    conduit_compose_dir: /opt/conduit
    conduit_data_dir: /opt/conduit/data
    conduit_image: matrixconduit/matrix-conduit:latest
    conduit_port: 8008
    hermes_home: /opt/hermes
    # Firewall port classes (mirrors group_vars/all/main.yml — keep in sync).
    docker_published_public_ports:
      - 80
      - 443
      - 8443
    docker_published_restricted_ports:
      - 3000
      - 8008
      - 8642
      - 9119
      - 8090
      - 3001
      - 53
    docker_published_restricted_udp_ports:
      - 53
    beszel_hub_data_dir: "{{ docker_compose_dir }}/beszel/hub"
    beszel_socket_dir: "{{ docker_compose_dir }}/beszel/socket"
    beszel_agent_data_dir: "{{ docker_compose_dir }}/beszel/agent"
    adguard_conf_dir: "{{ docker_compose_dir }}/adguard/conf"
    adguard_work_dir: "{{ docker_compose_dir }}/adguard/work"
    # Epic 20: caddy.yml.j2 scopes its 443 publish to this VPS's own public IP.
    # gather_facts is false here (this test only exercises template rendering,
    # no real host needed), so the fact is faked the same way other tests in
    # this repo fake config that would otherwise come from real host state.
    ansible_default_ipv4:
      address: "203.0.113.10"
    caddy_relay_socket_dir: "{{ docker_compose_dir }}/caddy-relay/socket"
    secrets:
      silverbullet_domain: test.example.com
      silverbullet_admin_username: admin
      silverbullet_admin_password: P4ssw04d
      hermes_signal_account: "+15551234567"
      hermes_default_github_token: fake-github-token
      syncplay_password: fake-syncplay-pass
      beszel_agent_key: fake-beszel-key
      beszel_agent_token: fake-beszel-token
      adguard_admin_username: admin
      adguard_admin_password_hash: "$2y$12$fakeAdguardBcryptHashXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
      cloudflare_api_token: fake-cf-token

  pre_tasks:
    - name: Ensure temp render dir exists
      ansible.builtin.file:
        path: "{{ docker_compose_dir }}"
        state: directory
        mode: '0755'

  tasks:
    # Epic 22 #07: mode matches the real role task (roles/docker/tasks/main.yml) — root:docker in a real
    # deploy; this local render can't set group ownership without root/a "docker" group existing on the test
    # host, so only mode is asserted below (the same value regardless of who owns the file).
    - name: Render consolidated docker-compose.yml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/docker/templates/docker-compose.yml.j2"
        dest: "{{ docker_compose_dir }}/docker-compose.yml"
        mode: '0640'

    - name: Stat rendered docker-compose.yml
      ansible.builtin.stat:
        path: "{{ docker_compose_dir }}/docker-compose.yml"
      register: compose_stat

    - name: Assert docker-compose.yml is not world-readable (epic 22 #07)
      ansible.builtin.assert:
        that:
          - compose_stat.stat.mode == '0640'
        fail_msg: "docker-compose.yml must be mode 0640 (root:docker), not world-readable — it bakes in every enabled service's secrets"

    - name: Slurp rendered docker-compose.yml for assertions
      ansible.builtin.slurp:
        path: "{{ docker_compose_dir }}/docker-compose.yml"
      register: rendered_compose

    # Epic 21 ticket #03: every RENDERED service must survive a reboot or a crash. caddy, authelia and
    # silverbullet had no restart policy and stayed down after a reboot until a manual deploy. The guard
    # inspects the rendered service set (not the fragment files), so list-driven fragments that render
    # several services from one template are covered service by service.
    - name: Every rendered service declares a restart policy that survives a reboot
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/support/assert_restart_policies.py {{ docker_compose_dir }}/docker-compose.yml"
      changed_when: false

    # Epic 19 ticket #01: Caddy now builds from a local Dockerfile (with the
    # Cloudflare DNS plugin compiled in, for ticket #02's DNS-01 challenges)
    # instead of pulling a stock image. Epic 19 ticket #02: 8443, not 8448
    # (Cloudflare's proxy allowlist includes 8443, not 8448), and a new
    # CLOUDFLARE_API_TOKEN env var for the DNS-01 directive in Caddyfile.j2
    # to read via Caddy's own {env.CLOUDFLARE_API_TOKEN} placeholder. Epic 20:
    # 443 is now scoped to this VPS's own public IP (not 0.0.0.0), freeing
    # <tailscale-ip>:443 for caddy-relay — 80 and 8443 are untouched (neither
    # has a source-IP gate the tailnet masquerade bug could break). The
    # internal PROXY-protocol listener is a shared Unix socket (a bind-mounted
    # directory), not a Docker-published port at all — a real security fix,
    # not a style choice: an IP-scoped loopback port couldn't actually
    # distinguish "the relay" from any other host-networked container in this
    # exact stack (beszel-agent already is one) or host-level process, since
    # Docker's own port-publish NAT gave them all the same apparent source.
    - name: Assert caddy builds from a local Dockerfile, not a pulled image
      ansible.builtin.assert:
        that:
          - compose.services.caddy.image is not defined
          - compose.services.caddy.build.context == (docker_compose_dir ~ '/caddy')
          - compose.services.caddy.build.dockerfile == 'Dockerfile'
          - compose.services.caddy.ports == ['80:80', '203.0.113.10:443:443', '8443:8443']
          - "'CLOUDFLARE_API_TOKEN=fake-cf-token' in compose.services.caddy.environment"
          - compose.services.caddy.volumes | sort == ([docker_compose_dir ~ '/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config', caddy_relay_socket_dir ~ ':/caddy-relay-socket'] | sort)
          - compose.services.caddy.depends_on == ['authelia']
          - compose.services.caddy.networks == ['gateway']
        fail_msg: >-
          caddy does not match the expected build shape. Rendered:
          {{ compose.services.caddy | default('MISSING') }}
      vars:
        compose: "{{ rendered_compose.content | b64decode | from_yaml }}"

    # Epic 20: caddy-relay is the new host-networked PROXY-protocol relay —
    # same network_mode: host precedent as beszel-agent, for a different
    # reason (binding this VPS's own Tailscale interface IP directly, not
    # host-level stats collection). Not on the gateway Docker network at all:
    # it only ever needs to reach Caddy over the shared Unix socket, not by
    # Docker service name.
    # user: root: found on the live VPS via two real crash-loops — the
    # official haproxy image's own Dockerfile launches its ENTRYPOINT
    # directly as a non-root user, so cap_add: NET_BIND_SERVICE (tried
    # first) had nothing to attach to even though `docker inspect` confirmed
    # it was correctly granted at the container level; network_mode: host
    # also ruled out the `--sysctl net.ipv4.ip_unprivileged_port_start=0`
    # alternative (scoped per network namespace, which a host-networked
    # container doesn't have its own copy of). Root here is HAProxy's own
    # standard pattern: the master process binds every privileged-port
    # socket as root, then drops to the unprivileged haproxy user/group via
    # its own config directives (roles/gateway/templates/haproxy.cfg.j2)
    # immediately after — not "run everything as root" as a shortcut.
    # The shared socket volume (not a Docker-published TCP port, found in
    # review to be a real auth-bypass vector — any host-networked container
    # or host-level process could otherwise reach it and forge a source IP)
    # is the actual security boundary for the internal listener.
    - name: Assert caddy-relay is host-networked and mounts its own config
      ansible.builtin.assert:
        that:
          - compose.services['caddy-relay'].network_mode == 'host'
          - compose.services['caddy-relay'].networks is not defined
          - compose.services['caddy-relay'].image == 'haproxy:3.4-alpine'
          - compose.services['caddy-relay'].user == 'root'
          - "(docker_compose_dir ~ '/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro') in compose.services['caddy-relay'].volumes"
          - "(caddy_relay_socket_dir ~ ':/caddy-relay-socket') in compose.services['caddy-relay'].volumes"
          - compose.services['caddy-relay'].depends_on == ['caddy']
        fail_msg: >-
          caddy-relay does not match the expected shape. Rendered:
          {{ compose.services['caddy-relay'] | default('MISSING') }}
      vars:
        compose: "{{ rendered_compose.content | b64decode | from_yaml }}"

    - name: Assert every published host port belongs to a declared firewall class
      # Closes the open-by-default gap (epic 12 #08 review): a future fragment
      # adding ports: ["X:X"] without classifying X would be silently
      # internet-reachable via Docker's DOCKER-USER bypass of UFW. The classes
      # mirror group_vars/all/main.yml (single source of truth for the firewall).
      ansible.builtin.assert:
        that:
          - published_ports | difference(classified_ports) | length == 0
        fail_msg: >-
          Published host ports {{ published_ports | difference(classified_ports) }}
          are not in any firewall class (public={{ docker_published_public_ports }},
          restricted={{ docker_published_restricted_ports }}, syncplay=8999).
          Classify them or drop the publication.
      vars:
        compose: "{{ rendered_compose.content | b64decode | from_yaml }}"
        # Extracts the HOST port regardless of whether the entry is the plain
        # `host:container` shape, the IP-scoped `ip:host:container` shape
        # (epic 20 — caddy's own ports gained this), or has a trailing
        # `/tcp`/`/udp` protocol suffix (adguard's DNS ports, pre-existing).
        # A naive strip-from-first-colon (this assertion's pre-epic-20 shape)
        # silently truncated an IP-scoped entry down to the first octet of
        # the IP itself, which then failed `int()` and fell back to Jinja's
        # documented 0 default — verified empirically: this exact regression
        # reproduced that failure, and a first fix attempt that added a bare
        # `$` end-anchor without also tolerating the protocol suffix broke
        # adguard's existing `53:53/tcp`/`53:53/udp` entries the same way, for
        # the same underlying reason (regex_replace returns the input
        # unchanged on no match, and the unchanged string still fails
        # `int()`) — both fixed together here, not sequentially.
        #
        # Epic 20's internal PROXY-protocol listener is a Unix socket, not a
        # published port at all (see Caddyfile.j2's own comment) — no
        # loopback-port exclusion needed here; every published port in this
        # stack is meant to be classified.
        published_ports: >-
          {{ compose.services.values() | selectattr('ports', 'defined')
             | map(attribute='ports') | flatten
             | map('regex_replace', '^(?:[^:]+:)?([0-9]+):[0-9]+(?:/[a-z]+)?$', '\1') | map('int') | unique | sort }}
        classified_ports: >-
          {{ (docker_published_public_ports + docker_published_restricted_ports
             + (docker_published_restricted_udp_ports | default([])) + [8999])
             | map('int') | unique | sort }}

    - name: Assert owntracks publishes no host port (structural, not substring)
      ansible.builtin.assert:
        that:
          - compose.services.owntracks.ports is not defined
          # Syncplay publishes exactly its 1:1 host port for DOCKER-USER IP filtering.
          - compose.services.syncplay.ports == ['8999:8999']
          - compose.services.owntracks.networks == ['gateway']
          # Recorder storage is a host bind-mount owned by the container uid, not a
          # named volume (a named volume initializes root-owned → mkdir /store/ghash
          # fails for the non-root recorder). No htpasswd bind-mount: the recorder
          # has no HTTP auth of its own (OTR_AUTH_FILE isn't a real config key) —
          # Caddy's basic_auth reads the host-side file directly, not the container.
          - compose.services.owntracks.volumes == [owntracks_data_dir ~ ':/store']
          - compose.services.syncplay.volumes == ['syncplay_data:/data']
        fail_msg: >-
          owntracks must not publish a host port (Caddy proxies it) and syncplay must
          publish exactly 8999:8999. Rendered services: {{ compose.services.keys() | list }}
      vars:
        compose: "{{ rendered_compose.content | b64decode | from_yaml }}"

    # Epic 18 ticket #02: the frontend is a browser UI for the recorder, reached
    # only via its own tailnet_only Caddy route — never a raw published host port,
    # same posture as the recorder itself. It reaches the recorder over the
    # internal gateway network by service name, not a host-published port.
    - name: Assert owntracks-frontend has no published port and reaches the recorder internally
      ansible.builtin.assert:
        that:
          - compose.services['owntracks-frontend'].image == 'owntracks/frontend:latest'
          - compose.services['owntracks-frontend'].ports is not defined
          - compose.services['owntracks-frontend'].networks == ['gateway']
          - "'SERVER_HOST=owntracks' in compose.services['owntracks-frontend'].environment"
          # SERVER_PORT must match the recorder's actual OTR_HTTPPORT (owntracks.yml.j2)
          # — a drift here would silently break the frontend's API calls without any
          # render-time error, since nothing else cross-checks the two fragments.
          - "'SERVER_PORT=8083' in compose.services['owntracks-frontend'].environment"
          - compose.services['owntracks-frontend'].volumes is not defined
        fail_msg: >-
          owntracks-frontend must not publish a host port and must point at the
          recorder over the internal network. Rendered service:
          {{ compose.services['owntracks-frontend'] | default('MISSING') }}
      vars:
        compose: "{{ rendered_compose.content | b64decode | from_yaml }}"

    # Epic 18 ticket #03: the hub is dual-reachable (Caddy tailnet_only route +
    # a directly-published, firewall-restricted raw port — the same
    # belt-and-suspenders posture SilverBullet's 3000 already has), while the
    # agent has NO published port and NO docker.sock mount (host-level stats
    # only, per the grilled minimal-privilege decision) — it connects to the hub
    # purely via the shared local socket file, verified against Beszel's own
    # official same-system docker-compose example.
    - name: Assert beszel-hub is dual-reachable and beszel-agent has no network/docker exposure
      ansible.builtin.assert:
        that:
          - compose.services['beszel-hub'].image == 'henrygd/beszel:latest'
          # APP_URL is not cosmetic — Beszel embeds it in outbound alert-notification
          # links (Shoutrrr/Discord/Mattermost etc.); it must point at the real
          # tailnet_only route, not localhost, or every such link is dead off-VPS.
          - "'APP_URL=https://monitor.test.example.com' in compose.services['beszel-hub'].environment"
          - compose.services['beszel-hub'].ports == ['8090:8090']
          - compose.services['beszel-hub'].networks == ['gateway']
          - compose.services['beszel-hub'].volumes | sort == ([beszel_hub_data_dir ~ ':/beszel_data', beszel_socket_dir ~ ':/beszel_socket'] | sort)
          - compose.services['beszel-agent'].image == 'henrygd/beszel-agent:latest'
          - compose.services['beszel-agent'].ports is not defined
          # network_mode: host is required (not a bridge network) for accurate
          # host-level network-interface stats — verified against upstream's own
          # example, not an oversight; the agent has no networks: key as a result
          # (network_mode: host and networks: are mutually exclusive in compose).
          - compose.services['beszel-agent'].network_mode == 'host'
          - compose.services['beszel-agent'].networks is not defined
          - compose.services['beszel-agent'].volumes | select('search', 'docker.sock') | list | length == 0
          - "'LISTEN=/beszel_socket/beszel.sock' in compose.services['beszel-agent'].environment"
          - "'HUB_URL=http://localhost:8090' in compose.services['beszel-agent'].environment"
          - "'TOKEN=fake-beszel-token' in compose.services['beszel-agent'].environment"
          - "'KEY=fake-beszel-key' in compose.services['beszel-agent'].environment"
        fail_msg: >-
          beszel-hub/beszel-agent do not match the expected shape. Rendered:
          {{ [compose.services['beszel-hub'] | default('MISSING'), compose.services['beszel-agent'] | default('MISSING')] }}
      vars:
        compose: "{{ rendered_compose.content | b64decode | from_yaml }}"

    # Epic 18 ticket #04: AdGuard's admin UI is dual-reachable like Beszel's hub —
    # a tailnet_only Caddy route (upstream: adguard:3000, the container's own
    # default listen port, unchanged) plus a directly-published host port (3001,
    # chosen specifically to avoid colliding with SilverBullet's 3000). No
    # `user:` override — the official image always runs as root (confirmed
    # against upstream), which is also why it can bind port 53 with no extra
    # capability configuration. Config is entirely file-based (AdGuardHome.yaml,
    # tested separately below), not env vars.
    #
    # Epic 18 ticket #05: DNS (53, both protocols) is also published — restricted
    # to Tailscale sources at the firewall (roles/tailscale/tasks/main.yml), not
    # public. AdGuardHome.yaml's dns.bind_hosts/port (set in ticket #04, in
    # anticipation of this) is what the container listens on internally.
    - name: Assert adguard is dual-reachable on a non-colliding port and serves DNS
      ansible.builtin.assert:
        that:
          - compose.services['adguard'].image == 'adguard/adguardhome:latest'
          - compose.services['adguard'].ports | sort == (['3001:3000', '53:53/tcp', '53:53/udp'] | sort)
          - compose.services['adguard'].networks == ['gateway']
          - compose.services['adguard'].volumes | sort == ([adguard_conf_dir ~ ':/opt/adguardhome/conf', adguard_work_dir ~ ':/opt/adguardhome/work'] | sort)
        fail_msg: >-
          adguard does not match the expected shape. Rendered:
          {{ compose.services['adguard'] | default('MISSING') }}
      vars:
        compose: "{{ rendered_compose.content | b64decode | from_yaml }}"

    - name: Assert all enabled services are present in rendered docker-compose.yml
      ansible.builtin.assert:
        that:
          - "'caddy:' in (rendered_compose.content | b64decode)"
          - "'authelia:' in (rendered_compose.content | b64decode)"
          - "'silverbullet:' in (rendered_compose.content | b64decode)"
          - "'conduit:' in (rendered_compose.content | b64decode)"
          - "'signal-cli:' in (rendered_compose.content | b64decode)"
          - "'hermes-agent:' in (rendered_compose.content | b64decode)"
          - "'owntracks:' in (rendered_compose.content | b64decode)"
          - "'owntracks-frontend:' in (rendered_compose.content | b64decode)"
          - "'beszel-hub:' in (rendered_compose.content | b64decode)"
          - "'beszel-agent:' in (rendered_compose.content | b64decode)"
          - "'adguard:' in (rendered_compose.content | b64decode)"
          - "'syncplay:' in (rendered_compose.content | b64decode)"
          - "'gateway:' in (rendered_compose.content | b64decode)"
          - "'internal:' in (rendered_compose.content | b64decode)"
          - "'caddy_data:' in (rendered_compose.content | b64decode)"
          - "'caddy_config:' in (rendered_compose.content | b64decode)"
          - "'owntracks_data:' not in (rendered_compose.content | b64decode)"
          - "'syncplay_data:' in (rendered_compose.content | b64decode)"
        fail_msg: "Rendered docker-compose.yml is missing expected services or configuration."

    # Epic 18 ticket #04: AdGuardHome.yaml is what actually skips the interactive
    # setup wizard — a real correctness stake, not just a compose-fragment shape.
    # Verified minimal shape against AdGuard's own official Configuration wiki:
    # users[].name/password, http.address, dns.bind_hosts/port. No schema_version
    # key (confirmed not required for a hand-written config; the only schema_version
    # example found upstream belongs to an explicitly experimental config rewrite).
    - name: Render AdGuard Home configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/adguard/templates/AdGuardHome.yaml.j2"
        dest: /tmp/docker_compose_test/AdGuardHome.yaml
      vars:
        secrets:
          adguard_admin_username: admin
          adguard_admin_password_hash: "$2y$12$fakeAdguardBcryptHashXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

    - name: Assert AdGuardHome.yaml has the confirmed wizard-skipping minimal shape
      ansible.builtin.assert:
        that:
          - adguard_config.users | length == 1
          - adguard_config.users[0].name == 'admin'
          - adguard_config.users[0].password == '$2y$12$fakeAdguardBcryptHashXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
          - adguard_config.http.address == '0.0.0.0:3000'
          - adguard_config.dns.bind_hosts == ['0.0.0.0']
          - adguard_config.dns.port == 53
          - "'schema_version' not in adguard_config"
        fail_msg: "AdGuardHome.yaml does not match the confirmed minimal shape: {{ adguard_config }}"
      vars:
        adguard_config: "{{ lookup('file', '/tmp/docker_compose_test/AdGuardHome.yaml') | from_yaml }}"
