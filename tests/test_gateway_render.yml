---
# Gateway render test (epic 03 ticket #04).
# Renders the gateway Caddyfile adapter from gateway_routes and asserts its external behavior:
#  - each declared route yields exactly one site block, with mfa_auth applied unless mfa: false
#  - a malformed route (missing upstream / non-boolean mfa / invalid tls_mode) fails fast at render
- hosts: localhost
  connection: local
  gather_facts: false
  # In a real run these come from the resolver + the per-role gateway_publish contributions.
  vars:
    gateway_caddyfile_dir: /tmp/gateway_test_render
    gateway_caddyfile_owner: "{{ ansible_user }}"
    gateway_caddyfile_group: "{{ ansible_user }}"
    secrets:
      silverbullet_domain: test.example.com
      acme_email: admin@test.example.com
      cloudflare_api_token: fake-cf-token
    # tailscale_subnet, tailscale_subnet_v6, and caddy_proxy_protocol_port (epic 20)
    # all come from the real group_vars/all/main.yml include_vars below, not
    # hardcoded here — this file already relies on that same file for several
    # other constants, so this follows the pattern already established in it.
    # Stand in for the facts the owntracks role's htpasswd-parsing tasks set in a real
    # run (roles/owntracks/tasks/main.yml) — this playbook only include_vars the role's
    # defaults, it doesn't execute its tasks.
    owntracks_basic_auth_user: owntracks_admin
    owntracks_basic_auth_hash: stubbcrypthashvalue
  pre_tasks:
    # Assemble the real gateway_routes the way the gateway role does (per-role contributions).
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/silverbullet/defaults/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/authelia/defaults/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/hermes/defaults/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/conduit/defaults/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/owntracks/defaults/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/beszel/defaults/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/adguard/defaults/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/main.yml"
    - ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/gateway/vars/main.yml"

  tasks:
    - name: Ensure temp render dir exists
      ansible.builtin.file:
        path: /tmp/gateway_test_render
        state: directory
        mode: '0755'

    # Epic 13 ticket #01: catches an accidental deletion of a schema entry — the schema
    # is the single source of truth ticket #02's validate.yml engine walks generically.
    - name: Gateway route schema declares exactly the 8 currently-live fields
      ansible.builtin.assert:
        that:
          - (gateway_route_schema | map(attribute='field') | list | sort) ==
            (['basic_auth_hash', 'basic_auth_user', 'host', 'mfa', 'port', 'tailnet_only', 'tls_mode', 'upstream'] | sort)
          - gateway_route_schema | selectattr('required', 'undefined') | list | length == 0
        fail_msg: "gateway route schema (vars/main.yml) fields mismatch: {{ gateway_route_schema | map(attribute='field') | list }}"

    # Positive guard: the real assembled gateway_routes must pass shape validation. Unlike the
    # negative tests below, this is intentionally NOT rescued — a malformed production route must
    # fail this check loudly instead of rendering a broken (silent-502) Caddyfile.
    - name: Real assembled gateway_routes must pass shape validation
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
      vars:
        gateway_routes: "{{ silverbullet_gateway_publish + hermes_gateway_publish + authelia_gateway_publish + conduit_gateway_publish + owntracks_gateway_publish + beszel_gateway_publish + adguard_gateway_publish }}"

    - name: Render the gateway Caddyfile adapter
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/gateway/templates/Caddyfile.j2"
        dest: /tmp/gateway_test_render/Caddyfile
      vars:
        gateway_routes: "{{ silverbullet_gateway_publish + hermes_gateway_publish + authelia_gateway_publish + conduit_gateway_publish + owntracks_gateway_publish + beszel_gateway_publish + adguard_gateway_publish }}"

    # Regression guard removed — the template change (moving Conduit from hardcoded block to
    # gateway loop, adding tls_mode/port fields, and adding matrix. prefix) is an intentional
    # change that will alter the rendered output. Functional assertions below verify correctness.

    - name: Assert one site block per route (two for mfa/tailnet_only-gated ones) and correct wrapping
      ansible.builtin.assert:
        that:
          # Epic 20: every mfa/tailnet_only-gated route (wiki, dash, owntracks-ui,
          # monitor, adguard — 5 of the 8 routes) now renders TWO separate site
          # blocks (one per listener), not one block with a second comma-joined
          # address — verified against a real Caddy binary that a Unix-socket
          # address comma-joined onto a normal hostname address silently
          # mis-parses as a URL host+path match instead of a second listener.
          # Total block count is therefore routes + gated routes, not just routes.
          - "(rendered | regex_findall('\\.test\\.example\\.com[^{]*\\{')) | length == (gateway_routes | length) + gated_route_count"
          - "(rendered | regex_findall('reverse_proxy ')) | length == (gateway_routes | length) + gated_route_count"
          - "rendered is search('wiki\\.test\\.example\\.com \\{')"
          - "rendered is search('dash\\.test\\.example\\.com \\{')"
          - "rendered is search('auth.test.example.com \\{')"
          - "rendered is search('https://matrix.test.example.com:8443 \\{')"
          - "rendered is search('https://owntracks.test.example.com:8443 \\{')"
          # The (dns01_tls) snippet (epic 19 #02) is defined once, unconditionally,
          # at file scope — same shape as mfa_auth/tailnet_only above — and imported
          # by exactly the routes named in Caddyfile.j2's dns01_hosts list.
          - "'(dns01_tls) {' in rendered"
          # Matrix: tls_mode auto (ADR-0003) — real ACME cert; no bare `tls` line.
          # Port 8443, not 8448 (epic 19 #02): Cloudflare's proxy allowlist includes
          # 8443, not 8448. `import dns01_tls` (epic 19 #02) replaces automatic
          # HTTPS's default HTTP-01/TLS-ALPN-01 challenges for exactly this route
          # and owntracks' recorder below — those default challenges need the
          # origin directly reachable, which breaks once the DNS record is proxied.
          # Neither route is mfa/tailnet_only-gated, so neither gets a second block.
          - "rendered is search('https://matrix\\.test\\.example\\.com:8443 \\{\\n  log\\n  import dns01_tls\\n  reverse_proxy conduit:8008\\n\\}')"
          # OwnTracks: tls_mode auto renders the https:// scheme (automatic HTTPS →
          # real ACME cert) and NO bare `tls` line — a bare `tls` line is a Caddyfile
          # parse error that prevents Caddy from starting. mfa false omits import
          # mfa_auth; basic_auth is the actual enforcement (the recorder has none
          # of its own — see roles/owntracks/tasks/main.yml). import dns01_tls
          # comes before basic_auth in the rendered block (Caddyfile.j2's own
          # directive order), same DNS-01 reasoning as matrix above.
          - "rendered is search('https://owntracks\\.test\\.example\\.com:8443 \\{\\n  log\\n  import dns01_tls\\n  basic_auth \\{\\n    owntracks_admin stubbcrypthashvalue\\n  \\}\\n  reverse_proxy owntracks:8083\\n\\}')"
          # Epic 18 ticket #02 / epic 20: the OwnTracks frontend's route is
          # tailnet_only — its normal :443 block (no public path posture change
          # here) plus its second, Unix-socket-bound block for the internal
          # listener (epic 20's actual fix — this exact block is what makes it
          # reachable again from a real tailnet client).
          - "rendered is search('owntracks-ui\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy owntracks-frontend:80\\n\\}')"
          - "rendered is search('owntracks-ui\\.test\\.example\\.com \\{\\n  bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy owntracks-frontend:80\\n\\}')"
          # Epic 18 ticket #03: Beszel's hub dashboard is also tailnet_only — same
          # posture as owntracks-ui, both blocks.
          - "rendered is search('monitor\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy beszel-hub:8090\\n\\}')"
          - "rendered is search('monitor\\.test\\.example\\.com \\{\\n  bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy beszel-hub:8090\\n\\}')"
          # Epic 18 ticket #04: AdGuard's admin UI, same tailnet_only posture, both blocks.
          - "rendered is search('adguard\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy adguard:3000\\n\\}')"
          - "rendered is search('adguard\\.test\\.example\\.com \\{\\n  bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy adguard:3000\\n\\}')"
          # import mfa_auth/import tailnet_only now appear TWICE per gated route
          # (once per block), not once — mfa: wiki+dash (2 routes x 2 blocks = 4);
          # tailnet_only: owntracks-ui+monitor+adguard (3 routes x 2 blocks = 6).
          - "(rendered | regex_findall('import mfa_auth')) | length == (gateway_routes | selectattr('mfa') | list | length) * 2"
          - "(rendered | regex_findall('import tailnet_only')) | length == (gateway_routes | selectattr('tailnet_only', 'defined') | selectattr('tailnet_only') | list | length) * 2"
          # basic_auth is only ever on the owntracks recorder, which isn't
          # gated (mfa: false, no tailnet_only) — one block, one occurrence,
          # unaffected by the dual-block change.
          - "(rendered | regex_findall('basic_auth \\{')) | length == (gateway_routes | selectattr('basic_auth_user', 'defined') | list | length)"
          # Epic 19 ticket #02: DNS-01 is scoped to exactly matrix + owntracks — not
          # wiki/dash/auth/syncplay (untouched), and not any epic-18 tailnet_only
          # route (tls internal, no ACME at all) — confirmed by both the byte-exact
          # blocks above and this count, so a future route accidentally matching
          # dns01_hosts wouldn't silently add a third occurrence unnoticed. The
          # snippet definition's own `dns cloudflare` line appears exactly once
          # regardless of how many routes import it (snippets aren't inlined per
          # import site) — the per-route fan-out is `import dns01_tls`, not this.
          # Neither matrix nor owntracks is gated, so this count is unaffected by
          # the dual-block change.
          - "(rendered | regex_findall('dns cloudflare')) | length == 1"
          - "(rendered | regex_findall('import dns01_tls')) | length == 2"
          # Regression guard (epic 12): routes without tls_mode render `tls internal`
          # (pre-epic-12 behavior) — wiki, dash, auth, and (epic 18 #02/#03/#04)
          # owntracks-ui/monitor/adguard. Matrix and the recorder use tls_mode auto
          # (real ACME certs, ADR-0003). Was 6 (one per non-auto_tls route); now
          # 6 + gated_route_count, since every gated route's SECOND block also
          # renders tls internal.
          - "(rendered | regex_findall('tls internal')) | length == 6 + gated_route_count"
          # Byte-exact block assertions for every mfa:true route's FIRST (normal
          # :443) block — epic 18 ticket #01 review: wiki/dash previously only had
          # a partial opening-line check here, not the same byte-exact block
          # coverage auth/matrix/owntracks already had. Each gated route's SECOND
          # (Unix-socket) block is asserted separately below.
          - "rendered is search('wiki\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  import mfa_auth\\n  reverse_proxy silverbullet:3000\\n\\}')"
          - "rendered is search('wiki\\.test\\.example\\.com \\{\\n  bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666\\n  log\\n  tls internal\\n  import mfa_auth\\n  reverse_proxy silverbullet:3000\\n\\}')"
          - "rendered is search('dash\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  import mfa_auth\\n  reverse_proxy hermes-agent:9119\\n\\}')"
          - "rendered is search('dash\\.test\\.example\\.com \\{\\n  bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666\\n  log\\n  tls internal\\n  import mfa_auth\\n  reverse_proxy hermes-agent:9119\\n\\}')"
          - "rendered is search('auth\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  reverse_proxy authelia:9091\\n\\}')"
          - "'forward_auth @not_tailscale authelia:9091' in rendered"
          - "rendered is search('not remote_ip')"
          - "rendered is search('email admin@test\\.example\\.com')"
          # Epic 20: both matchers must check the v6 tailnet range too, not just v4
          # (pre-existing gap this epic's investigation surfaced — tailscale_subnet_v6
          # was already defined and used by the DOCKER-USER v6 rules, but never wired
          # into either Caddyfile matcher until now). Matchers are defined once each
          # at file scope, unaffected by the dual-block change.
          - "(rendered | regex_findall('not remote_ip 100\\.64\\.0\\.0/10 fd7a:115c:a1e0::/48')) | length == 2"
          # Epic 20: exactly the 5 mfa/tailnet_only-gated routes get a second,
          # Unix-socket-bound block — not matrix/owntracks (8443, no source-IP
          # gate) and not auth (no mfa/tailnet_only import at all). A future route
          # accidentally matching would silently add a 6th occurrence unnoticed
          # without this count, the same reasoning as the dns01 count above.
          - "(rendered | regex_findall('bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666')) | length == gated_route_count"
          # Epic 20: the internal PROXY-protocol-trusting listener is defined
          # exactly once, scoped to its own dedicated Unix socket address — never
          # applied to the public listener (no servers block exists for :443 at
          # all in this Caddyfile; omitting one is what leaves it with Caddy's
          # own unmodified defaults).
          - "(rendered | regex_findall('listener_wrappers \\{')) | length == 1"
          - "(rendered | regex_findall('proxy_protocol \\{')) | length == 1"
          - "rendered is search('servers unix//caddy-relay-socket/caddy-relay\\.sock\\|0666 \\{\\n    listener_wrappers \\{\\n      proxy_protocol \\{\\n        allow 127\\.0\\.0\\.1/32 ::1/128\\n      \\}\\n      tls\\n    \\}\\n  \\}')"
        fail_msg: "Gateway Caddyfile shape mismatch: {{ rendered }}"
      vars:
        rendered: "{{ lookup('file', '/tmp/gateway_test_render/Caddyfile') }}"
        gateway_routes: "{{ silverbullet_gateway_publish + hermes_gateway_publish + authelia_gateway_publish + conduit_gateway_publish + owntracks_gateway_publish + beszel_gateway_publish + adguard_gateway_publish }}"
        gated_route_count: >-
          {{ (gateway_routes | selectattr('mfa') | list | length) +
             (gateway_routes | selectattr('tailnet_only', 'defined') | selectattr('tailnet_only') | list | length) }}

    # Epic 18 ticket #01: a route with tailnet_only: true renders a hard 404 block for
    # non-Tailscale sources instead of the MFA-bypass challenge — genuinely no public
    # path, not merely gated. Rendered against a synthetic route into a separate file
    # so the real-route assertions above stay untouched. (Epic 18 ticket #02 later
    # added a real tailnet_only route, owntracks-ui, asserted above alongside the
    # other real routes — this synthetic one stays for the isolated positive/negative
    # schema coverage below, independent of any specific service's real field values.)
    - name: Render a synthetic tailnet_only route
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/gateway/templates/Caddyfile.j2"
        dest: /tmp/gateway_test_render/Caddyfile.tailnet_only
      vars:
        gateway_routes:
          - host: monitor
            upstream: beszel-hub:8090
            mfa: false
            tailnet_only: true

    - name: Assert the tailnet_only route hard-blocks non-Tailscale sources with no MFA/basic_auth
      ansible.builtin.assert:
        that:
          - "'(tailnet_only) {' in rendered_tailnet_only"
          - "rendered_tailnet_only is search('respond @not_tailscale_hard 404')"
          # Exact-match on both rendered blocks (log line through closing brace) —
          # this alone already proves no import mfa_auth / basic_auth line snuck
          # in, since any extra line would break the match. tailnet_only: true
          # gates the route (epic 20), so it gets both the normal :443 block and
          # the second, Unix-socket-bound block.
          - "rendered_tailnet_only is search('monitor\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy beszel-hub:8090\\n\\}')"
          - "rendered_tailnet_only is search('monitor\\.test\\.example\\.com \\{\\n  bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666\\n  log\\n  tls internal\\n  import tailnet_only\\n  reverse_proxy beszel-hub:8090\\n\\}')"
        fail_msg: "tailnet_only route did not render the expected hard-block shape: {{ rendered_tailnet_only }}"
      vars:
        rendered_tailnet_only: "{{ lookup('file', '/tmp/gateway_test_render/Caddyfile.tailnet_only') }}"

    # A route could in principle set both mfa: true and tailnet_only: true. This
    # renders that combination and proves the one thing the Jinja layer can
    # actually prove: the {% if %}/{% endif %} chain doesn't misrender when both
    # branches are true (e.g. a nesting mistake silently dropping one import) —
    # both imports land in the block, each on its own line, nothing swallowed.
    #
    # It deliberately does NOT assert anything about @not_tailscale/@not_tailscale_hard
    # here: both snippets are defined once, unconditionally, at file scope, so their
    # definition lines appear in every render regardless of this route's flags —
    # asserting on them here would test a static template invariant, not this
    # scenario. Whether Caddy itself accepts two distinctly-named matchers imported
    # into one server block is a real question this Jinja-only render test cannot
    # answer (no caddy binary in this environment); the schema comment's "safe by
    # construction" claim rests on the matcher names being different by design
    # (visible directly in Caddyfile.j2's source), not on anything provable here.
    - name: Render a synthetic route with both mfa and tailnet_only set
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/gateway/templates/Caddyfile.j2"
        dest: /tmp/gateway_test_render/Caddyfile.both_flags
      vars:
        gateway_routes:
          - host: monitor
            upstream: beszel-hub:8090
            mfa: true
            tailnet_only: true

    - name: Assert a route with both flags renders both imports intact
      ansible.builtin.assert:
        that:
          - "rendered_both_flags is search('monitor\\.test\\.example\\.com \\{\\n  log\\n  tls internal\\n  import tailnet_only\\n  import mfa_auth\\n  reverse_proxy beszel-hub:8090\\n\\}')"
          - "rendered_both_flags is search('monitor\\.test\\.example\\.com \\{\\n  bind unix//caddy-relay-socket/caddy-relay\\.sock\\|0666\\n  log\\n  tls internal\\n  import tailnet_only\\n  import mfa_auth\\n  reverse_proxy beszel-hub:8090\\n\\}')"
        fail_msg: "route with mfa+tailnet_only both set did not render safely: {{ rendered_both_flags }}"
      vars:
        rendered_both_flags: "{{ lookup('file', '/tmp/gateway_test_render/Caddyfile.both_flags') }}"

    - name: Malformed route (non-boolean tailnet_only) must fail fast
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: wiki
                upstream: silverbullet:3000
                mfa: false
                tailnet_only: "yes"
      rescue:
        - ansible.builtin.set_fact:
            nonboolean_tailnet_only_failed_fast: true
      always:
        - ansible.builtin.assert:
            that:
              - nonboolean_tailnet_only_failed_fast | default(false)
            fail_msg: "gateway did NOT fail fast on a non-boolean tailnet_only"

    - name: Malformed route (missing upstream) must fail fast
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: wiki
      rescue:
        - ansible.builtin.set_fact:
            missing_upstream_failed_fast: true
      always:
        - ansible.builtin.assert:
            that:
              - missing_upstream_failed_fast | default(false)
            fail_msg: "gateway did NOT fail fast on a route missing upstream"

    - name: Malformed route (non-boolean mfa) must fail fast
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: wiki
                upstream: silverbullet:3000
                mfa: "yes"
      rescue:
        - ansible.builtin.set_fact:
            nonboolean_mfa_failed_fast: true
      always:
        - ansible.builtin.assert:
            that:
              - nonboolean_mfa_failed_fast | default(false)
            fail_msg: "gateway did NOT fail fast on a non-boolean mfa"

    - name: Malformed route (invalid tls_mode) must fail fast
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: wiki
                upstream: silverbullet:3000
                mfa: true
                tls_mode: "invalid"
      rescue:
        - ansible.builtin.set_fact:
            invalid_tls_mode_failed_fast: true
      always:
        - ansible.builtin.assert:
            that:
              - invalid_tls_mode_failed_fast | default(false)
            fail_msg: "gateway did NOT fail fast on an invalid tls_mode"

    - name: Malformed route (non-integer port) must fail fast
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: wiki
                upstream: silverbullet:3000
                mfa: true
                port: "8448"
      rescue:
        - ansible.builtin.set_fact:
            noninteger_port_failed_fast: true
      always:
        - ansible.builtin.assert:
            that:
              - noninteger_port_failed_fast | default(false)
            fail_msg: "gateway did NOT fail fast on a non-integer port"

    - name: Malformed route (basic_auth_user without basic_auth_hash) must fail fast
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: wiki
                upstream: silverbullet:3000
                mfa: true
                basic_auth_user: someone
      rescue:
        - ansible.builtin.set_fact:
            lone_basic_auth_user_failed_fast: true
      always:
        - ansible.builtin.assert:
            that:
              - lone_basic_auth_user_failed_fast | default(false)
            fail_msg: "gateway did NOT fail fast on basic_auth_user without a matching hash"

    # Epic 13, #02: spot-check that the schema-driven engine's failure message names
    # the specific field it violated (not one giant combined message covering all 7).
    - name: Malformed route (non-string host) must fail fast naming the host field
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: 12345
                upstream: silverbullet:3000
                mfa: true
      rescue:
        - ansible.builtin.set_fact:
            nonstring_host_failed_fast: true
            # A looped task's own .msg is just "One or more items failed" — the
            # per-item fail_msg text lives in .results[i].msg for the failing item(s).
            nonstring_host_error_msg: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | list | join('; ') }}
      always:
        - ansible.builtin.assert:
            that:
              - nonstring_host_failed_fast | default(false)
              - "'host' in nonstring_host_error_msg"
              - "'string' in nonstring_host_error_msg"
            fail_msg: >-
              gateway did NOT fail fast with a host-specific message;
              got: {{ nonstring_host_error_msg | default('nothing') }}

    - name: Malformed route (non-string basic_auth_hash) must fail fast naming that field
      block:
        - ansible.builtin.include_tasks:
            file: "{{ playbook_dir }}/../roles/gateway/tasks/validate.yml"
          vars:
            gateway_routes:
              - host: wiki
                upstream: silverbullet:3000
                mfa: true
                basic_auth_user: someone
                basic_auth_hash: 42
      rescue:
        - ansible.builtin.set_fact:
            nonstring_hash_failed_fast: true
            nonstring_hash_error_msg: >-
              {{ ansible_failed_result.results | default([ansible_failed_result])
                 | selectattr('failed', 'defined') | selectattr('failed')
                 | map(attribute='msg') | list | join('; ') }}
      always:
        - ansible.builtin.assert:
            that:
              - nonstring_hash_failed_fast | default(false)
              - "'basic_auth_hash' in nonstring_hash_error_msg"
              - "'string' in nonstring_hash_error_msg"
            fail_msg: >-
              gateway did NOT fail fast with a basic_auth_hash-specific message;
              got: {{ nonstring_hash_error_msg | default('nothing') }}
